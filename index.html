<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17120e">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Garden">
<link rel="preconnect" href="https://generativelanguage.googleapis.com" crossorigin>
<link rel="preconnect" href="https://api.openai.com" crossorigin>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon-64.png?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png?v=2">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
<title>Jordan's Life Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --serif:'Lora',Georgia,serif; --sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
  --r:12px; --r-sm:8px; --pxmin:1.1;
  /* activity colors (label always shown alongside) */
  --c-exercise:#5b9e6b; --c-meals:#d98e3b; --c-rest:#8a7fc0; --c-focus:#c4573a; --c-together:#d0668f;
  --c-sleep:#4f6b9a; --c-appointments:#b8862f; --c-travel:#5f8f9a; --c-routine:#8a9a5b; --c-other:#8c7b6b;
}
[data-theme=dark]{
  --bg:#17120e; --bg2:#1f1913; --card:#251e17; --card2:#2d241b; --line:#3d3226; --line2:#4d3f30;
  --ink:#f3e7d3; --ink2:#c9b79c; --ink3:#9a8670; --accent:#e8964a; --accent2:#f2b56b; --good:#8fbf7a; --warn:#e6b14a; --bad:#e2735e;
  --shadow:0 6px 24px rgba(0,0,0,.35); --veil:rgba(23,18,14,.72);
}
[data-theme=light]{
  --bg:#f7f0e4; --bg2:#efe5d4; --card:#fffaf2; --card2:#f6ecdc; --line:#e2d3bc; --line2:#d3bf9f;
  --ink:#2b2017; --ink2:#5d4b39; --ink3:#8a7660; --accent:#b8561f; --accent2:#9a4515; --good:#4c8a3a; --warn:#a87411; --bad:#b4442f;
  --shadow:0 6px 20px rgba(80,50,20,.12); --veil:rgba(247,240,228,.78);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.sans{font-family:var(--sans)}
a{color:var(--accent2)}
h1,h2,h3{font-weight:600;line-height:1.2;margin:0}
h2{font-size:1.35rem} h3{font-size:1.05rem}
.muted{color:var(--ink3)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.stack>*+*{margin-top:.75rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}

/* ---------- hero ---------- */
.hero{position:relative;height:230px;overflow:hidden;border-bottom:1px solid var(--line)}
.hero > img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;transition:filter .6s}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,var(--bg) 100%)}
.hero .title{position:absolute;left:1.5rem;bottom:1rem;z-index:2}
.hero h1{font-size:2rem;text-shadow:0 2px 12px rgba(0,0,0,.5);color:#fff7ea}
h1 .logo{width:2.4rem;height:2.4rem;border-radius:.6rem;vertical-align:-.45rem;margin-right:.6rem;box-shadow:0 2px 10px rgba(0,0,0,.45)}
@media (max-width:860px){h1 .logo{width:1.9rem;height:1.9rem;border-radius:.5rem;vertical-align:-.35rem;margin-right:.45rem}}
.hero .sub{color:#f6e6cc;text-shadow:0 1px 8px rgba(0,0,0,.6);font-style:italic}
[data-theme=light] .hero h1{color:#2b2017;text-shadow:0 1px 10px rgba(255,248,235,.9)}
[data-theme=light] .hero .sub{color:#4a3826;text-shadow:0 1px 8px rgba(255,248,235,.9)}
.hero .topright{position:absolute;right:1rem;top:1rem;z-index:2;display:flex;gap:.5rem;align-items:center}
.season-winter > img{filter:saturate(.35) hue-rotate(185deg) brightness(1.05) contrast(.95)}
.season-spring > img{filter:hue-rotate(70deg) saturate(.9) brightness(1.05)}
.season-summer > img{filter:hue-rotate(40deg) saturate(1.15) brightness(1.04)}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 230px)}
nav.side{border-right:1px solid var(--line);padding:1rem .75rem;position:sticky;top:0;align-self:start;height:100vh;overflow:auto;background:var(--bg2)}
nav.side button{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;background:none;border:0;padding:.55rem .7rem;border-radius:var(--r-sm);cursor:pointer;color:var(--ink2);font-size:.98rem}
nav.side button:hover{background:var(--card)}
nav.side button[aria-current=page]{background:var(--card2);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
nav.side .ico{width:1.2rem;text-align:center}
nav.side .sep{height:1px;background:var(--line);margin:.6rem .4rem}
main{padding:1.25rem 1.5rem 4rem;max-width:1400px;width:100%}
.mobile-nav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav.side{display:none}
  .mobile-nav{display:block;position:sticky;top:0;z-index:30;background:var(--bg2);border-bottom:1px solid var(--line);padding:.5rem .75rem}
  .mobile-nav select{width:100%}
  main{padding:1rem .8rem 5rem}
  .hero{height:170px} .hero h1{font-size:1.45rem} .hero .sub{font-size:.85rem} .hero .topright{top:.6rem;right:.6rem} .hero .title{left:1rem;bottom:.6rem}
}

/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem}
.card.flat{background:transparent}
.card h3{margin-bottom:.5rem}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.sec-head p{margin:.25rem 0 0;color:var(--ink3)}
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line2);background:var(--card2);padding:.42rem .8rem;border-radius:999px;cursor:pointer;font-family:var(--sans);font-size:.86rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b120a;font-weight:600}
[data-theme=light] .btn.primary{color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line2))}
.btn.sm{padding:.22rem .6rem;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{background:none;border:0;cursor:pointer;color:var(--ink3);padding:.2rem .35rem;border-radius:6px;font-size:1rem;line-height:1}
.iconbtn:hover{color:var(--ink);background:var(--card2)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],input[type=month],input[type=file],input:not([type]),select,textarea{
  background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r-sm);padding:.42rem .6rem;min-width:0;font-family:var(--sans);font-size:.9rem}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{width:100%;resize:vertical;min-height:4.5rem}
label.f{display:flex;flex-direction:column;gap:.2rem;font-family:var(--sans);font-size:.78rem;color:var(--ink3)}
label.f>input,label.f>select,label.f>textarea{color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--sans);font-size:.72rem;padding:.12rem .5rem;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);background:var(--bg2);white-space:nowrap}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.dot{width:.65rem;height:.65rem;border-radius:50%;display:inline-block;flex:none}
.tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:1rem}
.tabs button{border:1px solid var(--line2);background:transparent;padding:.32rem .8rem;border-radius:999px;cursor:pointer;font-family:var(--sans);font-size:.84rem;color:var(--ink2)}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:.86rem}
table.t th{text-align:left;font-weight:500;color:var(--ink3);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
table.t td{padding:.35rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td input,table.t td select{width:100%}
table.t tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem}
.stat .k{font-family:var(--sans);font-size:.74rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .s{font-family:var(--sans);font-size:.78rem;color:var(--ink3)}
.empty{padding:1.2rem;text-align:center;color:var(--ink3);border:1px dashed var(--line2);border-radius:var(--r);font-style:italic}
.bar{height:.55rem;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent)}
details.disc{border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
details.disc>summary{cursor:pointer;padding:.7rem 1rem;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.disc>summary::after{content:"▸";color:var(--ink3);transition:transform .2s}
details.disc[open]>summary::after{transform:rotate(90deg)}
details.disc>.in{padding:0 1rem 1rem}

/* save pill */
.pill{font-family:var(--sans);font-size:.75rem;padding:.25rem .65rem;border-radius:999px;background:var(--veil);border:1px solid var(--line2);backdrop-filter:blur(6px);display:inline-flex;gap:.35rem;align-items:center;color:var(--ink)}
.pill .dot{width:.5rem;height:.5rem}

/* ---------- today ---------- */
.cmdbar{display:flex;gap:.5rem;margin-bottom:1rem}
.cmdbar input{flex:1;font-size:1rem;padding:.6rem .9rem;border-radius:999px}
.daystrip{display:grid;grid-template-columns:auto repeat(7,1fr) auto;gap:.35rem;align-items:stretch;margin-bottom:1rem}
.daystrip .d{border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:.35rem .2rem;text-align:center;cursor:pointer;font-family:var(--sans);font-size:.78rem;color:var(--ink2);position:relative}
.daystrip .d b{display:block;font-family:var(--serif);font-size:1.15rem;color:var(--ink)}
.daystrip .d[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--card2)}
.daystrip .d.today::before{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.daystrip .d .load{display:block;height:3px;margin:.3rem .5rem 0;border-radius:2px;background:var(--line)}
.daystrip .d .load i{display:block;height:100%;background:var(--accent2);border-radius:2px}
.today-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);gap:1.25rem;align-items:start}
@media (max-width:1100px){.today-grid{grid-template-columns:1fr}}

.tl-wrap{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.tl-scroll{max-height:72vh;overflow-y:auto;position:relative}
.tl{position:relative;margin-left:58px;margin-right:8px}
.tl .hr{position:absolute;left:-58px;right:-8px;border-top:1px solid var(--line);font-family:var(--sans);font-size:.7rem;color:var(--ink3)}
.tl .hr span{position:absolute;left:8px;top:-.55rem;background:var(--card);padding:0 4px}
.tl .hr.half{border-top-style:dashed;opacity:.45}
.tl .now{position:absolute;left:-6px;right:0;border-top:2px solid var(--bad);z-index:5;pointer-events:none}
.tl .now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.blk{position:absolute;border-radius:8px;padding:.25rem .5rem;overflow:hidden;cursor:pointer;font-family:var(--sans);font-size:.8rem;line-height:1.25;color:#fff;
  background:var(--bc);border:1px solid color-mix(in srgb,var(--bc) 70%,#000);box-shadow:0 1px 3px rgba(0,0,0,.25);touch-action:none;user-select:none}
.blk .bt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .bm{opacity:.9;font-size:.72rem}
.blk.fixed{background:repeating-linear-gradient(135deg,var(--bc) 0 10px,color-mix(in srgb,var(--bc) 82%,#000) 10px 20px)}
.blk.protected{opacity:.8;background:color-mix(in srgb,var(--bc) 65%,var(--card))}
.blk.st-proposed{background:color-mix(in srgb,var(--bc) 42%,var(--card));border:1.5px dashed color-mix(in srgb,var(--bc) 85%,#fff);color:var(--ink)}
.blk.st-proposed.fixed,.blk.st-proposed.protected{background:color-mix(in srgb,var(--bc) 42%,var(--card))}
.blk.st-needs{box-shadow:0 0 0 2px var(--warn)}
.blk .stb{display:inline-block;min-width:1.05em;text-align:center;border-radius:4px;background:rgba(0,0,0,.25);font-size:.68rem;padding:0 .15rem}
.draftcard{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.blk.done{opacity:.5}.blk.done .bt{text-decoration:line-through}
.blk.conflict{outline:2px solid var(--bad);outline-offset:1px}
.blk.dragging{opacity:.85;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.blk.ghost{opacity:.3;pointer-events:none}
.blk.preview{outline:2px dashed var(--accent2);outline-offset:1px}
.blk .grip{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.blk .grip::after{content:"";position:absolute;left:50%;bottom:2px;width:22px;margin-left:-11px;height:3px;border-radius:2px;background:rgba(255,255,255,.55)}
.blk .lock{position:absolute;right:5px;top:3px;font-size:.7rem;opacity:.85}
.blk:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.droptime{position:absolute;right:6px;z-index:25;font-family:var(--sans);font-size:.72rem;background:var(--ink);color:var(--bg);padding:.1rem .4rem;border-radius:4px;pointer-events:none}

.pri{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .2rem;border-bottom:1px solid var(--line)}
.pri:last-child{border-bottom:0}
.pri .chk{width:1.25rem;height:1.25rem;border-radius:50%;border:2px solid var(--line2);background:none;cursor:pointer;flex:none;margin-top:.15rem;display:grid;place-items:center;font-size:.75rem;color:transparent}
.pri .chk.on{background:var(--good);border-color:var(--good);color:#fff}
.pri .t{flex:1;min-width:0}
.pri .t .ti{font-weight:500}
.pri.done .ti{text-decoration:line-through;color:var(--ink3)}
.pri .acts{display:flex;gap:.1rem;opacity:.55}
.pri:hover .acts,.pri:focus-within .acts{opacity:1}
.pri.focus{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 12%,transparent),transparent);border-radius:8px}
.pri .handle{cursor:grab;color:var(--ink3);padding:.1rem .15rem;user-select:none}
.pri.over{box-shadow:0 -2px 0 var(--accent)}

/* week grid */
.wk{display:grid;grid-template-columns:50px repeat(7,minmax(90px,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:auto;max-height:75vh}
.wk .wh{position:sticky;top:0;z-index:4;background:var(--card2);border-bottom:1px solid var(--line);padding:.4rem;text-align:center;font-family:var(--sans);font-size:.8rem;cursor:pointer}
.wk .wh.sel{color:var(--accent2);font-weight:600}
.wk .col{position:relative;border-left:1px solid var(--line)}
.wk .gut{position:relative}
.wk .gut span{position:absolute;right:6px;font-family:var(--sans);font-size:.68rem;color:var(--ink3);transform:translateY(-50%)}
.wk .hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.6}
.wk .blk{left:3px;right:3px;font-size:.7rem;padding:.15rem .3rem}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .mc{min-width:0;overflow:hidden}
.month .mh{font-family:var(--sans);font-size:.72rem;color:var(--ink3);text-align:center;padding:.2rem}
.month .mc{min-height:76px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.25rem .35rem;cursor:pointer;font-family:var(--sans);font-size:.72rem}
.month .mc.out{opacity:.4}
.month .mc.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.month .mc.today .n{background:var(--accent);color:#1b120a;border-radius:99px;padding:0 .35rem}
.month .mc .ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:.25rem;align-items:center}

/* modal */
dialog{border:1px solid var(--line2);border-radius:16px;background:var(--card);color:var(--ink);padding:0;max-width:min(640px,94vw);width:100%;box-shadow:var(--shadow)}
dialog.wide{max-width:min(960px,96vw);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,7,4,.55);backdrop-filter:blur(2px)}
dialog .mh{padding:1rem 1.2rem .4rem;display:flex;justify-content:space-between;align-items:center}
dialog .mb{padding:.4rem 1.2rem 1rem;max-height:70vh;overflow:auto}
dialog .mf{padding:.8rem 1.2rem;border-top:1px solid var(--line);display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.diff{font-family:var(--sans);font-size:.85rem}
.diff li{padding:.25rem 0}
.diff .from{color:var(--ink3);text-decoration:line-through}
.diff .to{color:var(--good);font-weight:600}

/* toast */
#toasts{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:.55rem 1rem;border-radius:14px;max-width:92vw;font-family:var(--sans);font-size:.86rem;display:flex;gap:.8rem;align-items:center;box-shadow:var(--shadow);animation:tin .25s ease}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;font-family:var(--sans)}
[data-theme=dark] .toast button{color:#a8501c}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:.75rem;overflow-x:auto}
.kan .col{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:.6rem;min-height:120px}
.kan .col h4{margin:0 0 .5rem;font-family:var(--sans);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.kan .kc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;margin-bottom:.5rem;font-size:.9rem}

/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--bg2);border:1px solid var(--line)}
.stars{color:#e8b84a;letter-spacing:1px}

.kbd{font-family:var(--sans);font-size:.7rem;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 .3rem;color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hide{display:none!important}
@media print{nav.side,.mobile-nav,.hero .topright,.cmdbar{display:none}.shell{grid-template-columns:1fr}}
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
body{padding-left:var(--sal);padding-right:var(--sar);overscroll-behavior-y:none}
.hero .topright{top:calc(1rem + var(--sat))}
.tabbar{display:none}
.morelist button{display:flex;gap:.7rem;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:.85rem .3rem;font-size:1.05rem;color:var(--ink);text-align:left;cursor:pointer}

  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false }).formatToParts(d).map(x => [x.type, x.value]));
  return { date: `${p.year}-${p.month}-${p.day}`, min: (+p.hour % 24) * 60 + +p.minute };
}
const todayISO = () => pacificParts().date;

const dObj = iso => { const [y, m, d] = iso.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };

const fmtDate = (s, o = { weekday: 'long', month: 'long', day: 'numeric' }) => s ? dObj(s).toLocaleDateString('en-US', { timeZone: 'UTC', ...o }) : '';

function fmtTime(m) {

/* ---------- activity categories ---------- */
const CATS = {

  if (sync.cfg) { setStatus('pending', 'Waiting to sync…'); clearTimeout(sync.timer); sync.timer = setTimeout(syncNow, 1500); }

/* ---------- restore points: automatic local copies of the whole plan ----------
   Kept in IndexedDB on this device (room for many full copies), newest first.
   Taken before an app update, once a day, and before anything that replaces lots of data. */
const SNAP_KEEP = 14;
const snapCounts = o => ({ blocks: (o.blocks || []).length, tasks: (o.tasks || []).length, money: ((o.money || {}).entries || []).length, notes: Object.keys(o.daynotes || {}).length });
let snapDB = null;
function snapOpen() {
  return snapDB || (snapDB = new Promise((res, rej) => {
    if (!window.indexedDB) return rej(new Error('IndexedDB unavailable'));
    const r = indexedDB.open('lifegarden', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('snaps', { keyPath: 't' });
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
}
async function snapTx(mode, fn) {
  const db = await snapOpen();
  return new Promise((res, rej) => { const tx = db.transaction('snaps', mode), req = fn(tx.objectStore('snaps')); tx.oncomplete = () => res(req && req.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error); });
}
async function snapList() {
  try { return ((await snapTx('readonly', st => st.getAll())) || []).sort((a, b) => b.t - a.t); }
  catch (e) { try { const o = JSON.parse(localStorage.getItem('lifegarden.snap') || 'null'); return o ? [o] : []; } catch (e2) { return []; } }
}
async function takeSnapshot(reason, dataStr) {
  const data = dataStr || JSON.stringify(S), rec = { t: Date.now(), reason, version: APP_VERSION, day: todayISO(), counts: snapCounts(dataStr ? JSON.parse(dataStr) : S), data };
  try {
    await snapTx('readwrite', st => st.put(rec));
    const all = await snapList();
    if (all.length > SNAP_KEEP) await snapTx('readwrite', st => { let r; for (const o of all.slice(SNAP_KEEP)) r = st.delete(o.t); return r; });
    return true;
  } catch (e) {
    try { localStorage.setItem('lifegarden.snap', JSON.stringify(rec)); return true; } catch (e2) { console.warn('restore point failed', e, e2); return false; }
  }
}
async function snapGet(t) { const all = await snapList(); return all.find(o => o.t === +t); }
const isEmptyPlan = o => !o.blocks.length && !o.tasks.length && !(o.money.entries || []).length;
/* called once at start-up, after the saved plan is loaded */
async function bootSnapshots() {
  if (isEmptyPlan(S)) { localStorage.setItem('lifegarden.appver', APP_VERSION); return; }
  const prev = localStorage.getItem('lifegarden.appver');
  if (prev !== APP_VERSION) { if (await takeSnapshot(prev ? `Before app update (${prev} → ${APP_VERSION})` : 'First open of this version')) localStorage.setItem('lifegarden.appver', APP_VERSION); }
  const all = await snapList();
  if (!all.some(o => o.day === todayISO())) await takeSnapshot('Daily copy');
}
/* ================= Today: time blocking ================= */
const STATUS = { confirmed: ['Confirmed by Jordan', '✓'], source: ['Source-listed', 'ⓢ'], sourceproposed: ['Source + proposed', 'ⓢ'], needs: ['Needs confirmation', '?'], proposed: ['Proposed (draft)', '~'] };
const draftHidden = () => S.settings.showDraft === false;
const dayBlocks = (d, list = S.blocks) => list.filter(b => b.date === d && !(b.status === 'proposed' && draftHidden())).sort((a, b) => a.start - b.start || a.end - b.end);
const isMovable = b => b.kind === 'flexible' && !b.done;
function sleepZones() {
  const f = fromHHMM(S.settings.sleepFrom), t = fromHHMM(S.settings.sleepTo);
  if (f == null || t == null) return [];
  return f > t ? [{ s: 0, e: t, title: 'Sleep' }, { s: f, e: 1440, title: 'Sleep' }] : [{ s: f, e: t, title: 'Sleep' }];
}
function immovables(d, list = S.blocks, exceptId) {
  return [...dayBlocks(d, list).filter(b => b.id !== exceptId && !isMovable(b)).map(b => ({ s: b.start, e: b.end, title: b.title })), ...sleepZones()];
}
const overlaps = (a, b) => a.s < b.e && b.s < a.e;
function earliest(t, dur, occ, limit = 1440) {
  for (let guard = 0; guard < 500; guard++) {
    const c = occ.find(o => t < o.e && t + dur > o.s);
    if (!c) return t + dur <= limit ? t : null;
    t = c.e;
  }
  return null;
}
function conflictsOn(d, list = S.blocks) {
  const bl = dayBlocks(d, list), out = [], ids = new Set();
  for (let i = 0; i < bl.length; i++) for (let j = i + 1; j < bl.length; j++) {
    if (bl[j].start >= bl[i].end) break;
    out.push([bl[i], bl[j]]); ids.add(bl[i].id); ids.add(bl[j].id);
  }
  return { pairs: out, ids };
}
/* Move one flexible block; push only the flexible blocks it now collides with, later, by the minimum. */
function ripple(d, id, ns, list = S.blocks) {
  const b = list.find(x => x.id === id); const dur = b.end - b.start;
  if (ns < 0 || ns + dur > 1440) return { ok: false, reason: 'That would cross midnight. Split the block or choose an earlier time.' };
  const imm = immovables(d, list, id);
  const hit = imm.find(o => overlaps(o, { s: ns, e: ns + dur }));
  if (hit) return { ok: false, reason: `It would overlap “${hit.title}” (${fmtTime(hit.s)}–${fmtTime(hit.e)}), which is protected.` };
  const placed = [{ s: ns, e: ns + dur }], changes = [{ id, title: b.title, from: b.start, to: ns, dur }];
  for (const f of dayBlocks(d, list).filter(x => x.id !== id && isMovable(x))) {
    const fd = f.end - f.start, iv = { s: f.start, e: f.end };
    if (placed.some(p => overlaps(p, iv))) {
      const t = earliest(f.start, fd, [...imm, ...placed]);
      if (t == null) return { ok: false, reason: `“${f.title}” would be pushed past the end of the day. Nothing was changed.` };
      placed.push({ s: t, e: t + fd }); changes.push({ id: f.id, title: f.title, from: f.start, to: t, dur: fd });
    } else placed.push(iv);
  }
  return { ok: true, changes };
}
/* Late start: re-flow unfinished flexible work from time T around protected time. */
function lateStart(d, T, trim) {
  const imm = immovables(d), placed = [], changes = [], issues = [];
  let cursor = T;
  for (const f of dayBlocks(d).filter(isMovable)) {
    let dur = f.end - f.start;
    const s0 = Math.max(f.start, cursor);
    let t = earliest(s0, dur, [...imm, ...placed]);
    if (t == null && trim) {
      const min = Math.max(f.minLen || 0, dur - trim);
      for (let dd = dur - 1; dd >= min && t == null; dd--) { t = earliest(s0, dd, [...imm, ...placed]); if (t != null) dur = dd; }
    }
    if (t == null) { issues.push(`“${f.title}” (${fmtDur(f.end - f.start)}) doesn't fit before the end of the day.`); continue; }
    placed.push({ s: t, e: t + dur }); cursor = t + dur;
    if (t !== f.start || dur !== f.end - f.start) changes.push({ id: f.id, title: f.title, from: f.start, fromEnd: f.end, to: t, toEnd: t + dur });
  }
  return { changes, issues };
}
function applyChanges(label, changes, d) {
  commit('blocks', label, bl => {
    for (const c of changes) { const b = bl.find(x => x.id === c.id); if (!b) continue; const dur = b.end - b.start; b.start = c.to; b.end = c.toEnd ?? c.to + dur; if (d) b.date = d; }
  }, { toast: label + ' — applied' });
}

/* ---------- timeline renderer ---------- */
function laneLayout(bl) {
  const out = new Map(); let cluster = [], clusterEnd = -1;
  const flush = () => { const lanes = []; for (const b of cluster) { let i = lanes.findIndex(e => e <= b.start); if (i < 0) { i = lanes.length; lanes.push(0); } lanes[i] = b.end; out.set(b.id, { lane: i }); } for (const b of cluster) out.get(b.id).n = lanes.length; cluster = []; };
  for (const b of bl) { if (b.start >= clusterEnd && cluster.length) { flush(); clusterEnd = -1; } cluster.push(b); clusterEnd = Math.max(clusterEnd, b.end); }
  if (cluster.length) flush();
  return out;
}
function range(bl) {
  let a = S.settings.dayStart * 60, b = S.settings.dayEnd * 60;
  for (const x of bl) { a = Math.min(a, Math.floor(x.start / 60) * 60); b = Math.max(b, Math.ceil(x.end / 60) * 60); }
  return [a, Math.min(b, 1440)];
}
function timelineHTML(d, list, opts = {}) {
  const px = opts.px || 1.1, bl = dayBlocks(d, list), [r0, r1] = range(bl), lay = laneLayout(bl), cf = conflictsOn(d, list).ids;
  let h = `<div class="tl" data-r0="${r0}" data-px="${px}" style="height:${(r1 - r0) * px + 12}px;margin-top:10px">`;
  for (const z of sleepZones()) { const s = Math.max(z.s, r0), e = Math.min(z.e, r1); if (e > s) h += `<div style="position:absolute;left:0;right:0;top:${(s - r0) * px}px;height:${(e - s) * px}px;background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--c-sleep) 14%,transparent) 8px 16px);border-radius:6px" aria-hidden="true"></div>`; }
  for (let m = r0; m <= r1; m += 30) h += `<div class="hr ${m % 60 ? 'half' : ''}" style="top:${(m - r0) * px}px">${m % 60 ? '' : `<span>${fmtTimeShort(m)}</span>`}</div>`;
  if (!opts.preview && d === todayISO()) { const n = nowMin(); if (n >= r0 && n <= r1) h += `<div class="now" style="top:${(n - r0) * px}px" title="Now"></div>`; }
  for (const b of bl) {
    const L = lay.get(b.id), w = 100 / L.n, c = catOf(b), short = (b.end - b.start) * px < 34;
    const cls = ['blk', b.kind, b.status ? 'st-' + b.status : '', b.done ? 'done' : '', cf.has(b.id) ? 'conflict' : '', opts.changed && opts.changed.has(b.id) ? 'preview' : ''].join(' '); const stl = b.status && STATUS[b.status];
    h += `<div class="${cls}" ${opts.preview ? '' : `tabindex="0" data-blk="${b.id}"`} role="button" aria-label="${esc(b.title)}, ${fmtTime(b.start)} to ${fmtTime(b.end)}, ${KINDS[b.kind]}, ${CATS[c].label}${stl ? ', ' + stl[0] : ''}${b.done ? ', done' : ''}"
      style="--bc:${catColor(c)};top:${(b.start - r0) * px}px;height:${Math.max(14, (b.end - b.start) * px - 2)}px;left:calc(${L.lane * w}% + 2px);width:calc(${w}% - 4px)">
      ${b.kind !== 'flexible' ? `<span class="lock" title="${KINDS[b.kind]}">🔒</span>` : ''}
      <div class="bt">${stl ? `<span class="stb" title="${stl[0]}">${stl[1]}</span> ` : ''}${esc(b.title)}${short ? ` <span class="bm">· ${fmtTimeShort(b.start)}</span>` : ''}</div>
      ${short ? '' : `<div class="bm">${fmtTimeShort(b.start)}–${fmtTimeShort(b.end)} · ${stl ? stl[0] : CATS[c].label}</div>`}
      ${!opts.preview && !b.done && (b.end - b.start) * px >= 40 ? '<div class="grip" data-grip="1" title="Drag to resize"></div>' : ''}
    </div>`;
  }
  return h + '</div>';
}

    const t0 = todayISO();
    if (!t.date) return d >= t0;                       // undated backlog shows today and ahead
    return t.date === d || (t.date < d && d === t0);   // overdue items carry into today only

/* ---------- timeline pointer interactions ---------- */
function wireTimeline(sc) {
  const tl = $('.tl', sc); const r0 = +tl.dataset.r0, px = +tl.dataset.px;
  const yToMin = y => Math.round((y / px + r0) / 15) * 15;
  tl.addEventListener('dblclick', e => {
    if (e.target.closest('.blk')) return;
    const y = e.clientY - tl.getBoundingClientRect().top; const s = clamp(yToMin(y), 0, 1410);
    openBlockEditor(null, { date: R.date, start: s, end: s + 60 });
  });
  $$('.blk[data-blk]', tl).forEach(el => {
    const b = S.blocks.find(x => x.id === el.dataset.blk);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBlockActions(b.id); }
      if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && isMovable(b)) { e.preventDefault(); reviewMove(b.id, b.start + (e.key === 'ArrowUp' ? -15 : 15)); }
    });
    const startDrag = (grip, y0) => {
      const top0 = el.offsetTop, h0 = el.offsetHeight; let moved = false, tag = null, val = null;
      return {
        move(y) {
          const dy = y - y0; if (!moved && Math.abs(dy) < 5) return;
          if (b.done) return;
          moved = true; el.classList.add('dragging');
          if (!tag) { tag = document.createElement('div'); tag.className = 'droptime'; tl.appendChild(tag); }
          if (grip) { val = Math.min(1440, Math.max(b.start + 15, yToMin(top0 + h0 + dy))); el.style.height = (val - b.start) * px - 2 + 'px'; tag.style.top = (val - r0) * px - 10 + 'px'; tag.textContent = 'ends ' + fmtTime(val); }
          else { val = clamp(yToMin(top0 + dy), 0, 1440 - (b.end - b.start)); el.style.top = (val - r0) * px + 'px'; tag.style.top = (val - r0) * px - 18 + 'px'; tag.textContent = fmtTime(val) + ' – ' + fmtTime(val + b.end - b.start); }
        },
        end(tapOpens = true) {
          tag && tag.remove(); el.classList.remove('dragging', 'lifted');
          if (!moved) { if (tapOpens) openBlockActions(b.id); return; }
          if (grip) {
            if (val === b.end) return render();
            const hit = immovables(b.date, S.blocks, b.id).find(o => overlaps(o, { s: b.start, e: val }));
            commit('blocks', 'resize ' + b.title, bl => { bl.find(x => x.id === b.id).end = val; }, { toast: `${b.title} now ends ${fmtTime(val)}${hit ? ` — overlaps ${hit.title}` : ''}` });
          } else { if (val === b.start) return render(); render(); reviewMove(b.id, val); }
        },
      };
    };
    // mouse / pen: drag straight away
    el.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch' || e.button !== 0) return;
      R.interacting = true; const d = startDrag(!!e.target.dataset.grip, e.clientY); el.setPointerCapture(e.pointerId);
      const mv = ev => d.move(ev.clientY);
      const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); R.interacting = false; d.end(); flushPendingRender(); };
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
    // touch: a quick tap opens the editor, press-and-hold lifts the block, the bottom handle resizes at once; a normal swipe scrolls the day
    el.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      const t0 = e.touches[0], grip = !!e.target.dataset.grip && !b.done; R.interacting = true;
      let d = null, cancelled = false, x0 = t0.clientX, y0 = t0.clientY, timer = null;
      const lift = () => { d = startDrag(grip, y0); el.classList.add('lifted'); if (navigator.vibrate) navigator.vibrate(12); };
      if (grip) lift(); else if (!b.done) timer = setTimeout(lift, 380);
      const mv = ev => { const t = ev.touches[0]; if (d) { ev.preventDefault(); d.move(t.clientY); } else if (Math.hypot(t.clientX - x0, t.clientY - y0) > 8) { cancelled = true; clearTimeout(timer); R.interacting = false; } };
      const end = ev => { clearTimeout(timer); R.interacting = false; el.removeEventListener('touchmove', mv); el.removeEventListener('touchend', end); el.removeEventListener('touchcancel', end); setTimeout(flushPendingRender, 0);
        if (d) { ev.preventDefault(); d.end(false); if (!el.classList.contains('dragging')) el.classList.remove('lifted'); }
        else if (!cancelled && ev.type === 'touchend') { ev.preventDefault(); openBlockActions(b.id); } };
      el.addEventListener('touchmove', mv, { passive: false }); el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
    }, { passive: true });
  });
}
function reviewMove(id, ns, nd) {
  const b = S.blocks.find(x => x.id === id); nd = nd || b.date;
  const sim = nd === b.date ? S.blocks : clone(S.blocks).map(x => x.id === id ? { ...x, date: nd } : x);
  const r = ripple(nd, id, ns, sim), dayTxt = nd !== b.date ? `${fmtDate(nd, { weekday: 'short', month: 'short', day: 'numeric' })}, ` : '';
  const list = r.ok ? r.changes.map(c => `<li><b>${esc(c.title)}</b>: <span class="from">${c.id === id && nd !== b.date ? fmtDate(b.date, { weekday: 'short', month: 'short', day: 'numeric' }) + ', ' : ''}${fmtTime(c.from)}</span> → <span class="to">${c.id === id ? dayTxt : ''}${fmtTime(c.to)}</span>–${fmtTime(c.to + c.dur)}</li>`).join('') : '';
  const lockNote = b.kind !== 'flexible' ? `<p class="small" style="color:var(--warn)">🔒 “${esc(b.title)}” is ${b.kind === 'fixed' ? 'a fixed appointment' : 'protected time'} — if it's a real booking, remember to change it with whoever it's with too.</p>` : '';
  openModal(`<div class="mh"><h3>Review move</h3><button class="iconbtn" data-act="close" aria-label="Close">✕</button></div>
   <div class="mb">${lockNote}${r.ok ? `<p class="small">${r.changes.length > 1 ? `Moving <b>${esc(b.title)}</b> pushes ${r.changes.length - 1} later flexible block${r.changes.length > 2 ? 's' : ''} by the minimum needed. Durations stay the same; locked time doesn't move.` : 'Only this block changes.'}</p><ul class="diff">${list}</ul>`
      : `<p><b>This move can't be applied as-is.</b></p><p class="small">${esc(r.reason)}</p><p class="tiny muted sans">Choose a different time, or move it anyway and keep the overlap visible to decide later.</p>`}</div>
   <div class="mf"><button class="btn" data-act="close">Cancel</button><button class="btn ${r.ok ? '' : 'primary'}" id="mvForce">${r.ok ? 'Move only this block' : 'Move anyway (keep overlap)'}</button>${r.ok ? `<button class="btn primary" id="mvApply">Apply ${r.changes.length > 1 ? r.changes.length + ' changes' : 'move'}</button>` : ''}</div>`, m => {
    if (r.ok) $('#mvApply', m).onclick = () => { closeModal(); applyChanges('move ' + b.title, r.changes, nd); };
    $('#mvForce', m).onclick = () => { closeModal(); applyChanges('move ' + b.title, [{ id, to: ns }], nd); };
  });
}

/* ---------- week grid: drag a block to another time or day ---------- */
function wireWeekDrag() {
  const wk = $('.wk'); if (!wk) return;
  const r0 = +wk.dataset.r0, px = +wk.dataset.px;
  $$('.blk[data-wblk]', wk).forEach(el => {
    const b = S.blocks.find(x => x.id === el.dataset.wblk); if (!b) return;
    const start = (x0, y0) => {
      const rect0 = el.getBoundingClientRect(), grabOff = y0 - rect0.top, label = el.querySelector('.bt'), orig = label.textContent;
      let target = null; el.classList.add('dragging');
      return {
        move(x, y) {
          el.style.transform = `translate(${x - x0}px, ${y - y0}px)`;
          el.style.pointerEvents = 'none';
          const col = document.elementsFromPoint(x, y).map(n => n.closest && n.closest('.col[data-date]')).find(Boolean);
          el.style.pointerEvents = '';
          if (!col) return;
          const top = y - grabOff - col.getBoundingClientRect().top, ns = clamp(Math.round((top / px + r0) / 15) * 15, 0, 1440 - (b.end - b.start));
          target = { date: col.dataset.date, start: ns }; label.textContent = `${DOW[dow(target.date)]} ${fmtTimeShort(ns)} · ${b.title}`;
        },
        end() {
          el.classList.remove('dragging'); el.style.transform = ''; label.textContent = orig;
          if (!target || (target.date === b.date && target.start === b.start)) return false;
          reviewMove(b.id, target.start, target.date); return true;
        },
      };
    };
    el.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch' || e.button !== 0 || b.done) return;
      const x0 = e.clientX, y0 = e.clientY; let d = null; el.setPointerCapture(e.pointerId);
      const mv = ev => { if (!d && Math.hypot(ev.clientX - x0, ev.clientY - y0) < 6) return; d = d || start(x0, y0); d.move(ev.clientX, ev.clientY); };
      const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); if (!(d && d.end())) openBlockActions(b.id); };
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
    el.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      const t = e.touches[0], x0 = t.clientX, y0 = t.clientY; let d = null, cancelled = false;
      const timer = b.done ? null : setTimeout(() => { d = start(x0, y0); el.classList.add('lifted'); if (navigator.vibrate) navigator.vibrate(12); }, 380);
      const mv = ev => { const p = ev.touches[0]; if (d) { ev.preventDefault(); d.move(p.clientX, p.clientY); } else if (Math.hypot(p.clientX - x0, p.clientY - y0) > 8) { cancelled = true; clearTimeout(timer); } };
      const end = ev => { clearTimeout(timer); el.removeEventListener('touchmove', mv); el.removeEventListener('touchend', end); el.removeEventListener('touchcancel', end); el.classList.remove('lifted');
        if (d) { ev.preventDefault(); d.end(); } else if (!cancelled && ev.type === 'touchend') { ev.preventDefault(); openBlockActions(b.id); } };
      el.addEventListener('touchmove', mv, { passive: false }); el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
    }, { passive: true });
  });
}

    ['Fixed appointments (dated)', hrs(b => b.kind === 'fixed'), 'appointments'], ['Protected time (dated)', hrs(b => b.kind === 'protected'), 'together'],

/* ================= Money ================= */
function entryAmt(e) { const a = e.settled && e.actual !== '' && e.actual != null ? +e.actual : e.est !== '' && e.est != null ? +e.est : (e.actual !== '' && e.actual != null ? +e.actual : null); return a == null ? null : (e.type === 'expense' ? -a : a); }
function entryFlags(e) { const f = []; if (!e.date) f.push('no date'); if ((e.est === '' || e.est == null) && (e.actual === '' || e.actual == null)) f.push('no amount'); if (e.settled && (e.actual === '' || e.actual == null)) f.push(e.type === 'income' ? 'received but no actual' : 'paid but no actual'); return f; }
VIEWS.money = () => {
  const mk = S.money.month || monthKey(R.date); const M = S.money;
  const inMonth = M.entries.filter(e => e.date && monthKey(e.date) === mk).sort((a, b) => a.date.localeCompare(b.date));
  const undated = M.entries.filter(e => !e.date);
  const est = t => sum(inMonth.filter(e => e.type === t).map(e => Math.abs(entryAmt(e) ?? 0)));
  const settled = t => sum(inMonth.filter(e => e.type === t && e.settled).map(e => +e.actual || 0));
  const open = M.openings[mk];
  let run = open && open.amount !== '' && open.amount != null ? +open.amount : null, unknownFrom = null;
  const flow = inMonth.map(e => { const a = entryAmt(e); if (a == null && run != null) { unknownFrom = unknownFrom || e; run = null; } else if (run != null) run += a; return { e, a, run }; });
  const ref = M.reference.filter(r => r.month === mk);
  const [tab, tabsH] = tabs('money', [['ledger', 'Ledger'], ['flow', 'Cash flow'], ['budget', 'Reference budget'], ['funds', 'Funds'], ['rates', 'Rates']]);
  const cols = [
    { f: 'type', label: 'Type', type: 'select', opts: ['income', 'expense'], w: '8.5rem', rerender: 1 }, { f: 'desc', label: 'Description' }, { f: 'cat', label: 'Category', w: '9rem' },
    { f: 'date', label: 'Date', type: 'date', w: '9.5rem', rerender: 1 }, { f: 'est', label: 'Estimate', type: 'number', w: '7rem', rerender: 1 }, { f: 'actual', label: 'Actual', type: 'number', w: '7rem', rerender: 1 },
    { f: 'settled', label: 'Received / paid', type: 'check', w: '6rem', rerender: 1 },
  ];
  let body = '';
  if (tab === 'ledger') body = `<div class="card">${tableEditor({ path: 'money.entries', cols, items: inMonth, addLabel: 'Entry', newItem: { type: 'expense', desc: '', cat: '', date: mk + '-01', est: '', actual: '', settled: false }, empty: 'No dated entries this month.', rowClass: e => entryFlags(e).length ? 'flag' : '' })}
      <div class="row" style="margin-top:.6rem">${M.presets.map(p => `<button class="btn sm ghost" data-act="preset" data-id="${p.id}">＋ ${esc(p.name)}${p.amount !== '' ? ' · ' + money(p.amount) : ''}</button>`).join('')}</div>
      <p class="tiny muted sans">Rate buttons create an undated, unreceived estimate — not a booking, not income yet.</p></div>
      ${undated.length || inMonth.some(e => entryFlags(e).length) ? `<div class="card" style="margin-top:1rem;border-color:color-mix(in srgb,var(--warn) 45%,var(--line))"><h3>Needs details</h3>
      ${tableEditor({ path: 'money.entries', cols, items: [...undated, ...inMonth.filter(e => entryFlags(e).length && e.date)], empty: '' })}
      <p class="tiny muted sans">${[...undated, ...inMonth].filter(e => entryFlags(e).length).map(e => `${esc(e.desc || '(untitled)')}: ${entryFlags(e).join(', ')}`).join(' · ')}</p></div>` : ''}`;
  if (tab === 'flow') body = `<div class="card"><div class="row" style="margin-bottom:.6rem"><label class="f">Opening balance for ${fmtDate(mk + '-01', { month: 'long', year: 'numeric' })}<input type="number" step="any" id="openBal" value="${open ? open.amount : ''}" placeholder="unknown"></label><span class="tiny muted sans" style="max-width:28rem">Belongs to this month only. Unknown is not zero. Received/paid entries use the actual amount; everything else uses the estimate.</span></div>
      <table class="t"><thead><tr><th>Date</th><th>Entry</th><th class="num">Amount</th><th class="num">Running estimate</th></tr></thead><tbody>${flow.map(({ e, a, run }) => `<tr><td>${fmtShort(e.date)}</td><td>${esc(e.desc || '(untitled)')} ${e.settled ? '<span class="chip good">' + (e.type === 'income' ? 'received' : 'paid') + '</span>' : '<span class="chip">expected</span>'}</td><td class="num" style="color:${a > 0 ? 'var(--good)' : 'inherit'}">${a == null ? '?' : money(a)}</td><td class="num">${run == null ? '<span class="muted">unknown</span>' : money(run)}</td></tr>`).join('') || '<tr><td colspan="4"><div class="empty small" style="border:0">No dated entries.</div></td></tr>'}</tbody></table>
      ${unknownFrom ? `<p class="tiny sans" style="color:var(--warn)">The running estimate becomes unknown at “${esc(unknownFrom.desc)}” because it has no amount.</p>` : ''}${run == null && !unknownFrom ? '<p class="tiny muted sans">Add an opening balance to see a running projection.</p>' : ''}</div>`;
  if (tab === 'budget') body = `<div class="card">${tableEditor({ path: 'money.reference', items: ref, cols: [{ f: 'kind', label: 'Type', type: 'select', opts: ['expense', 'income'], w: '7rem', rerender: 1 }, { f: 'label', label: 'Source line' }, { f: 'cat', label: 'Category', w: '9rem', rerender: 1 }, { f: 'amount', label: 'Amount', type: 'number', w: '8rem', rerender: 1 }, { f: 'q', label: 'Open question' }], addLabel: 'Source line', newItem: { month: mk, kind: 'expense', label: '', cat: '', amount: '', q: '' }, empty: 'No reference budget for this month.' })}
      ${ref.length ? `<p class="small sans">Source expenses: <b>${money(sum(ref.filter(r => r.kind === 'expense').map(r => r.amount)))}</b> · source income: <b>${money(sum(ref.filter(r => r.kind === 'income').map(r => r.amount)))}</b> · ledger expenses this month: <b>${money(est('expense'))}</b></p>` : ''}
      <p class="tiny muted sans">The reference budget is what a plan says; it never becomes ledger entries by itself. ${mk === '2026-10' ? 'The recovery archive only kept October’s totals (13 expense lines summing to $3,995, or $4,395 in the alternate utilities reading), not the lines — re-enter them here if you want the comparison.' : ''}</p></div>`;
  if (tab === 'funds') body = `<div class="grid3">${M.funds.map(f => { const rem = (+f.target || 0) - (+f.saved || 0), months = f.date ? Math.max(1, Math.ceil(daysBetween(todayISO(), f.date) / 30.4)) : null; return `<div class="card stack"><div class="row between"><input data-b="money.funds.#${f.id}.name" value="${esc(f.name)}" style="font-weight:600"><button class="iconbtn" data-act="delRow" data-path="money.funds" data-id="${f.id}" aria-label="Remove fund">✕</button></div>
      <div class="fgrid"><label class="f">Target<input type="number" data-b="money.funds.#${f.id}.target" data-rerender="1" value="${f.target}"></label><label class="f">Set aside<input type="number" data-b="money.funds.#${f.id}.saved" data-rerender="1" value="${f.saved}"></label><label class="f">By<input type="date" data-b="money.funds.#${f.id}.date" data-rerender="1" value="${f.date}"></label></div>
      ${f.target ? `<div class="bar"><i style="width:${Math.min(100, (+f.saved || 0) / f.target * 100)}%;background:var(--good)"></i></div><div class="small sans">${rem > 0 ? `${money(rem)} to go${months ? ` · about ${money(Math.ceil(rem / months))}/month` : ''}` : 'Fully funded ✓'}</div>` : '<div class="tiny muted sans">Set a target to track progress.</div>'}</div>`; }).join('')}
      <div class="card flat"><button class="btn" data-act="addRow" data-path="money.funds" data-new='{"name":"New fund","target":"","saved":"","date":""}'>＋ Fund</button><p class="tiny muted sans">Money set aside here isn't deducted from cash flow automatically.</p></div></div>`;
  if (tab === 'rates') body = `<div class="card">${tableEditor({ path: 'money.presets', cols: [{ f: 'name', label: 'Rate' }, { f: 'type', label: 'Type', type: 'select', opts: ['income', 'expense'], w: '7rem' }, { f: 'cat', label: 'Category', w: '9rem' }, { f: 'amount', label: 'Amount', type: 'number', w: '8rem', ph: 'confirm first' }], addLabel: 'Rate', newItem: { name: '', type: 'income', cat: '', amount: '' } })}<p class="tiny muted sans">Massage amounts are gross before expenses. The Thursday pay basis and tax treatment weren't confirmed in the archive.</p></div>`;
  return `<div class="sec-head"><div><h2>Money</h2><p class="sans small">Your own ledger, kept apart from source budgets and projections. No bank feed — every number here was entered by a person.</p></div>
    <label class="f">Planning month<input type="month" id="mMonth" value="${mk}"></label></div>
    <div class="grid3" style="margin-bottom:1rem">
      <div class="stat"><div class="k">Expected in</div><div class="v" style="color:var(--good)">${money(est('income'), '$0')}</div><div class="s">${money(settled('income'), '$0')} received</div></div>
      <div class="stat"><div class="k">Expected out</div><div class="v">${money(est('expense'), '$0')}</div><div class="s">${money(settled('expense'), '$0')} paid</div></div>
      <div class="stat"><div class="k">Estimated net</div><div class="v" style="color:${est('income') - est('expense') < 0 ? 'var(--bad)' : 'var(--ink)'}">${money(est('income') - est('expense'), '$0')}</div><div class="s">${run != null ? 'month-end ≈ ' + money(run) : 'add opening balance for month-end'}</div></div>
    </div>${tabsH}${body}`;
};

function toICS(from, to) {
  const pad = n => String(n).padStart(2, '0'), stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const dt = (d, m) => d.replace(/-/g, '') + 'T' + pad(Math.floor(m / 60)) + pad(m % 60) + '00';
  const escI = s => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, x => '\\' + x);
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Life Garden//EN', 'CALSCALE:GREGORIAN',
    'BEGIN:VTIMEZONE', 'TZID:America/Los_Angeles', 'BEGIN:DAYLIGHT', 'TZOFFSETFROM:-0800', 'TZOFFSETTO:-0700', 'TZNAME:PDT', 'DTSTART:19700308T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU', 'END:DAYLIGHT', 'BEGIN:STANDARD', 'TZOFFSETFROM:-0700', 'TZOFFSETTO:-0800', 'TZNAME:PST', 'DTSTART:19701101T020000', 'RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU', 'END:STANDARD', 'END:VTIMEZONE'];
  const ny = d => /New Jersey/i.test((S.daynotes[d] || {}).basis || '');
  const blocks = S.blocks.filter(b => b.date >= from && b.date <= to && !b.icsUid && !b.sleep && (b.status !== 'proposed' || S.settings.icsDraft));
  if (blocks.some(b => ny(b.date))) L.push('BEGIN:VTIMEZONE', 'TZID:America/New_York', 'BEGIN:DAYLIGHT', 'TZOFFSETFROM:-0500', 'TZOFFSETTO:-0400', 'TZNAME:EDT', 'DTSTART:19700308T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU', 'END:DAYLIGHT', 'BEGIN:STANDARD', 'TZOFFSETFROM:-0400', 'TZOFFSETTO:-0500', 'TZNAME:EST', 'DTSTART:19701101T020000', 'RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU', 'END:STANDARD', 'END:VTIMEZONE');

  try { const w = await aiJSON(BRIEF_RULES, 'Her week (JSON):\n' + JSON.stringify(weekData(t0)) + '\n\nWrite the week-ahead rundown. Today is ' + t0 + '.', WEEK_SCHEMA, 'week_briefing'); if (w) { brief.week = w; brief.ai.week = true; saveBrief({ ...briefCache(), weekOf: ws, weekDay: t0, week: w }); } } catch (e) { console.warn('week briefing', e); }
  brief.loading = false; drawBrief();
}
async function openBriefing(manual) {
  const t0 = todayISO(), c = briefCache();
  brief.tab = 'day'; brief.ai = { day: false, week: false }; brief.week = null;
  if (c.date === t0 && c.day) { brief.day = c.day; brief.ai.day = true; } else { brief.day = localDay(t0); brief.loading = true; }
  openModal(briefHTML(), wireBrief);
  saveBrief({ ...briefCache(), shown: t0 });
  if (!brief.ai.day) {
    try {
      const d = await aiJSON(BRIEF_RULES, `It is ${fmtTime(nowMin())} on ${fmtDate(t0)}. Her name is ${firstName()}.\nToday (JSON):\n` + JSON.stringify(briefData(t0)) + '\n\nWrite today\'s briefing.', DAY_SCHEMA, 'day_briefing');
      if (d) { brief.day = d; brief.ai.day = true; saveBrief({ ...briefCache(), date: t0, day: d }); }
    } catch (e) { console.warn('day briefing', e); }
    brief.loading = false; drawBrief();
  }
}
ACT.briefing = () => openBriefing(true);

/* once a day, when the app opens */
setTimeout(() => {
  if (S.settings.briefingOn === false || dlg().open || location.hash.startsWith('#connect=')) return;
  if (!S.blocks.length && !S.tasks.length) return;                    // brand-new, empty plan
  if (briefCache().shown === todayISO()) return;
  openBriefing(false);
}, 1600);
/* ================= boot ================= */
loadLocal();
if (!S.capacity.whatIf) S.capacity.whatIf = {};
parseHash();

render();
/* Show 24-hour times written inside saved text (titles, notes from the recovered draft) as normal 12-hour times.
   Display only: the saved text and the edit boxes keep exactly what was typed. */
(function show12hTimes() {
  const SKIP = /^(TEXTAREA|SCRIPT|STYLE|INPUT|SELECT|OPTION|PRE|CODE)$/;
  const fix = root => {
    if (root.nodeType === 3) { if (!SKIP.test(root.parentNode && root.parentNode.nodeName)) { const t = to12Typed(root.data); if (t !== root.data) root.data = t; } return; }
    if (root.nodeType !== 1 || SKIP.test(root.nodeName)) return;
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => SKIP.test(n.parentNode.nodeName) || !/\d:\d\d/.test(n.data) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    const list = []; while (w.nextNode()) list.push(w.currentNode);
    for (const n of list) { const t = to12Typed(n.data); if (t !== n.data) n.data = t; }
  };
  fix(document.body);
  new MutationObserver(ms => { for (const m of ms) m.addedNodes.forEach(fix); }).observe(document.body, { childList: true, subtree: true });
})();
$('#heroTitle') && $('#heroTitle').addEventListener('click', showStatus);   // tap the title to see the sync status again
bootSnapshots().catch(e => console.warn('restore points', e));
(function handleConnectLink() {
  const m = location.hash.match(/^#connect=(.+)$/); if (!m) return;
  const cfg = readSetupCode(m[1]); history.replaceState(null, '', '#today'); R.view = 'today';
  if (!cfg) return toast('That setup link is incomplete');
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (ios && !standalone) {
    openModal(`<div class="mh"><h3>Put Life Garden on your Home Screen</h3></div><div class="mb small stack">
      <p><b>1.</b> Tap <b>Copy setup code</b> below.</p><p><b>2.</b> Tap the Share button <span class="kbd">⬆</span> at the bottom of Safari, then <b>Add to Home Screen</b> → <b>Add</b>.</p>
      <p><b>3.</b> Open <b>Life Garden</b> from your Home Screen, go to <b>Settings & backup</b>, paste the code in “Connect a Google Sheet”, and tap Connect.</p>
      <p class="tiny muted sans">The Home Screen app keeps its own storage, which is why the code is pasted there rather than here.</p></div>
      <div class="mf"><button class="btn" data-act="close">Later</button><button class="btn primary" id="cpy">Copy setup code</button></div>`, mm => { $('#cpy', mm).onclick = () => navigator.clipboard?.writeText(setupCode(cfg)).then(() => { toast('Code copied'); }, () => { $('#cpy', mm).replaceWith(Object.assign(document.createElement('textarea'), { value: setupCode(cfg), readOnly: true, rows: 3 })); }); });
    return;
  }
  confirmBox('Connect this device to the shared Life Garden Google Sheet?', 'Connect').then(ok => ok && doConnect(cfg));
})();
if (sync.cfg) syncNow({ quiet: true }); else setStatus('local', 'Saved on this device');
setInterval(() => { if (R.view === 'today' && R.date === todayISO() && !dlg().open && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) { const n = $('.tl .now'); const tl = $('.tl'); if (n && tl) n.style.top = (nowMin() - +tl.dataset.r0) * +tl.dataset.px + 'px'; } }, 60000);
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  const hadController = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadController && !reloaded && !dlg().open) { reloaded = true; location.reload(); } });   // a new version arrived: load it once
  navigator.serviceWorker.register('sw.js').then(r => { r.update().catch(() => { }); document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update().catch(() => { }); }); }).catch(() => { });
}
