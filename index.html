<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17120e">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Life Garden">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Jordan's Life Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --serif:'Lora',Georgia,serif; --sans:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
  --r:12px; --r-sm:8px; --pxmin:1.1;
  /* activity colors (label always shown alongside) */
  --c-exercise:#5b9e6b; --c-meals:#d98e3b; --c-rest:#8a7fc0; --c-focus:#c4573a; --c-together:#d0668f;
  --c-sleep:#4f6b9a; --c-appointments:#b8862f; --c-travel:#5f8f9a; --c-routine:#8a9a5b; --c-other:#8c7b6b;
}
[data-theme=dark]{
  --bg:#17120e; --bg2:#1f1913; --card:#251e17; --card2:#2d241b; --line:#3d3226; --line2:#4d3f30;
  --ink:#f3e7d3; --ink2:#c9b79c; --ink3:#9a8670; --accent:#e8964a; --accent2:#f2b56b; --good:#8fbf7a; --warn:#e6b14a; --bad:#e2735e;
  --shadow:0 6px 24px rgba(0,0,0,.35); --veil:rgba(23,18,14,.72);
}
[data-theme=light]{
  --bg:#f7f0e4; --bg2:#efe5d4; --card:#fffaf2; --card2:#f6ecdc; --line:#e2d3bc; --line2:#d3bf9f;
  --ink:#2b2017; --ink2:#5d4b39; --ink3:#8a7660; --accent:#b8561f; --accent2:#9a4515; --good:#4c8a3a; --warn:#a87411; --bad:#b4442f;
  --shadow:0 6px 20px rgba(80,50,20,.12); --veil:rgba(247,240,228,.78);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.sans{font-family:var(--sans)}
a{color:var(--accent2)}
h1,h2,h3{font-weight:600;line-height:1.2;margin:0}
h2{font-size:1.35rem} h3{font-size:1.05rem}
.muted{color:var(--ink3)} .small{font-size:.85rem} .tiny{font-size:.75rem}
.row{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.stack>*+*{margin-top:.75rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1rem}

/* ---------- hero ---------- */
.hero{position:relative;height:230px;overflow:hidden;border-bottom:1px solid var(--line)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;transition:filter .6s}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,var(--bg) 100%)}
.hero .title{position:absolute;left:1.5rem;bottom:1rem;z-index:2}
.hero h1{font-size:2rem;text-shadow:0 2px 12px rgba(0,0,0,.5);color:#fff7ea}
.hero .sub{color:#f6e6cc;text-shadow:0 1px 8px rgba(0,0,0,.6);font-style:italic}
[data-theme=light] .hero h1{color:#2b2017;text-shadow:0 1px 10px rgba(255,248,235,.9)}
[data-theme=light] .hero .sub{color:#4a3826;text-shadow:0 1px 8px rgba(255,248,235,.9)}
.hero .topright{position:absolute;right:1rem;top:1rem;z-index:2;display:flex;gap:.5rem;align-items:center}
.season-winter img{filter:saturate(.35) hue-rotate(185deg) brightness(1.05) contrast(.95)}
.season-spring img{filter:hue-rotate(70deg) saturate(.9) brightness(1.05)}
.season-summer img{filter:hue-rotate(40deg) saturate(1.15) brightness(1.04)}

/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 230px)}
nav.side{border-right:1px solid var(--line);padding:1rem .75rem;position:sticky;top:0;align-self:start;height:100vh;overflow:auto;background:var(--bg2)}
nav.side button{display:flex;gap:.6rem;align-items:center;width:100%;text-align:left;background:none;border:0;padding:.55rem .7rem;border-radius:var(--r-sm);cursor:pointer;color:var(--ink2);font-size:.98rem}
nav.side button:hover{background:var(--card)}
nav.side button[aria-current=page]{background:var(--card2);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
nav.side .ico{width:1.2rem;text-align:center}
nav.side .sep{height:1px;background:var(--line);margin:.6rem .4rem}
main{padding:1.25rem 1.5rem 4rem;max-width:1400px;width:100%}
.mobile-nav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  nav.side{display:none}
  .mobile-nav{display:block;position:sticky;top:0;z-index:30;background:var(--bg2);border-bottom:1px solid var(--line);padding:.5rem .75rem}
  .mobile-nav select{width:100%}
  main{padding:1rem .8rem 5rem}
  .hero{height:170px} .hero h1{font-size:1.45rem} .hero .sub{font-size:.85rem} .hero .topright{top:.6rem;right:.6rem} .hero .title{left:1rem;bottom:.6rem}
}

/* ---------- components ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.1rem}
.card.flat{background:transparent}
.card h3{margin-bottom:.5rem}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1rem}
.sec-head p{margin:.25rem 0 0;color:var(--ink3)}
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--line2);background:var(--card2);padding:.42rem .8rem;border-radius:999px;cursor:pointer;font-family:var(--sans);font-size:.86rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#1b120a;font-weight:600}
[data-theme=light] .btn.primary{color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line2))}
.btn.sm{padding:.22rem .6rem;font-size:.78rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.iconbtn{background:none;border:0;cursor:pointer;color:var(--ink3);padding:.2rem .35rem;border-radius:6px;font-size:1rem;line-height:1}
.iconbtn:hover{color:var(--ink);background:var(--card2)}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],input[type=month],input[type=file],input:not([type]),select,textarea{
  background:var(--bg2);border:1px solid var(--line2);border-radius:var(--r-sm);padding:.42rem .6rem;min-width:0;font-family:var(--sans);font-size:.9rem}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
textarea{width:100%;resize:vertical;min-height:4.5rem}
label.f{display:flex;flex-direction:column;gap:.2rem;font-family:var(--sans);font-size:.78rem;color:var(--ink3)}
label.f>input,label.f>select,label.f>textarea{color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.6rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;font-family:var(--sans);font-size:.72rem;padding:.12rem .5rem;border-radius:999px;border:1px solid var(--line2);color:var(--ink2);background:var(--bg2);white-space:nowrap}
.chip.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.chip.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.chip.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.dot{width:.65rem;height:.65rem;border-radius:50%;display:inline-block;flex:none}
.tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:1rem}
.tabs button{border:1px solid var(--line2);background:transparent;padding:.32rem .8rem;border-radius:999px;cursor:pointer;font-family:var(--sans);font-size:.84rem;color:var(--ink2)}
.tabs button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
table.t{width:100%;border-collapse:collapse;font-family:var(--sans);font-size:.86rem}
table.t th{text-align:left;font-weight:500;color:var(--ink3);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;padding:.4rem .5rem;border-bottom:1px solid var(--line)}
table.t td{padding:.35rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}
table.t td input,table.t td select{width:100%}
table.t tr.flag td:first-child{box-shadow:inset 3px 0 0 var(--warn)}
.num{text-align:right;font-variant-numeric:tabular-nums}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:.8rem 1rem}
.stat .k{font-family:var(--sans);font-size:.74rem;color:var(--ink3);text-transform:uppercase;letter-spacing:.05em}
.stat .v{font-size:1.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .s{font-family:var(--sans);font-size:.78rem;color:var(--ink3)}
.empty{padding:1.2rem;text-align:center;color:var(--ink3);border:1px dashed var(--line2);border-radius:var(--r);font-style:italic}
.bar{height:.55rem;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent)}
details.disc{border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
details.disc>summary{cursor:pointer;padding:.7rem 1rem;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.disc>summary::after{content:"▸";color:var(--ink3);transition:transform .2s}
details.disc[open]>summary::after{transform:rotate(90deg)}
details.disc>.in{padding:0 1rem 1rem}

/* save pill */
.pill{font-family:var(--sans);font-size:.75rem;padding:.25rem .65rem;border-radius:999px;background:var(--veil);border:1px solid var(--line2);backdrop-filter:blur(6px);display:inline-flex;gap:.35rem;align-items:center;color:var(--ink)}
.pill .dot{width:.5rem;height:.5rem}

/* ---------- today ---------- */
.cmdbar{display:flex;gap:.5rem;margin-bottom:1rem}
.cmdbar input{flex:1;font-size:1rem;padding:.6rem .9rem;border-radius:999px}
.daystrip{display:grid;grid-template-columns:auto repeat(7,1fr) auto;gap:.35rem;align-items:stretch;margin-bottom:1rem}
.daystrip .d{border:1px solid var(--line);background:var(--card);border-radius:var(--r-sm);padding:.35rem .2rem;text-align:center;cursor:pointer;font-family:var(--sans);font-size:.78rem;color:var(--ink2);position:relative}
.daystrip .d b{display:block;font-family:var(--serif);font-size:1.15rem;color:var(--ink)}
.daystrip .d[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--card2)}
.daystrip .d.today::before{content:"";position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.daystrip .d .load{display:block;height:3px;margin:.3rem .5rem 0;border-radius:2px;background:var(--line)}
.daystrip .d .load i{display:block;height:100%;background:var(--accent2);border-radius:2px}
.today-grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(300px,1fr);gap:1.25rem;align-items:start}
@media (max-width:1100px){.today-grid{grid-template-columns:1fr}}

.tl-wrap{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden}
.tl-scroll{max-height:72vh;overflow-y:auto;position:relative}
.tl{position:relative;margin-left:58px;margin-right:8px}
.tl .hr{position:absolute;left:-58px;right:-8px;border-top:1px solid var(--line);font-family:var(--sans);font-size:.7rem;color:var(--ink3)}
.tl .hr span{position:absolute;left:8px;top:-.55rem;background:var(--card);padding:0 4px}
.tl .hr.half{border-top-style:dashed;opacity:.45}
.tl .now{position:absolute;left:-6px;right:0;border-top:2px solid var(--bad);z-index:5;pointer-events:none}
.tl .now::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.blk{position:absolute;border-radius:8px;padding:.25rem .5rem;overflow:hidden;cursor:pointer;font-family:var(--sans);font-size:.8rem;line-height:1.25;color:#fff;
  background:var(--bc);border:1px solid color-mix(in srgb,var(--bc) 70%,#000);box-shadow:0 1px 3px rgba(0,0,0,.25);touch-action:none;user-select:none}
.blk .bt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .bm{opacity:.9;font-size:.72rem}
.blk.fixed{background:repeating-linear-gradient(135deg,var(--bc) 0 10px,color-mix(in srgb,var(--bc) 82%,#000) 10px 20px)}
.blk.protected{opacity:.8;background:color-mix(in srgb,var(--bc) 65%,var(--card))}
.blk.st-proposed{background:color-mix(in srgb,var(--bc) 42%,var(--card));border:1.5px dashed color-mix(in srgb,var(--bc) 85%,#fff);color:var(--ink)}
.blk.st-proposed.fixed,.blk.st-proposed.protected{background:color-mix(in srgb,var(--bc) 42%,var(--card))}
.blk.st-needs{box-shadow:0 0 0 2px var(--warn)}
.blk .stb{display:inline-block;min-width:1.05em;text-align:center;border-radius:4px;background:rgba(0,0,0,.25);font-size:.68rem;padding:0 .15rem}
.draftcard{border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}
.blk.done{opacity:.5}.blk.done .bt{text-decoration:line-through}
.blk.conflict{outline:2px solid var(--bad);outline-offset:1px}
.blk.dragging{opacity:.85;z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.blk.ghost{opacity:.3;pointer-events:none}
.blk.preview{outline:2px dashed var(--accent2);outline-offset:1px}
.blk .grip{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.blk .grip::after{content:"";position:absolute;left:50%;bottom:2px;width:22px;margin-left:-11px;height:3px;border-radius:2px;background:rgba(255,255,255,.55)}
.blk .lock{position:absolute;right:5px;top:3px;font-size:.7rem;opacity:.85}
.blk:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.droptime{position:absolute;right:6px;z-index:25;font-family:var(--sans);font-size:.72rem;background:var(--ink);color:var(--bg);padding:.1rem .4rem;border-radius:4px;pointer-events:none}

.pri{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .2rem;border-bottom:1px solid var(--line)}
.pri:last-child{border-bottom:0}
.pri .chk{width:1.25rem;height:1.25rem;border-radius:50%;border:2px solid var(--line2);background:none;cursor:pointer;flex:none;margin-top:.15rem;display:grid;place-items:center;font-size:.75rem;color:transparent}
.pri .chk.on{background:var(--good);border-color:var(--good);color:#fff}
.pri .t{flex:1;min-width:0}
.pri .t .ti{font-weight:500}
.pri.done .ti{text-decoration:line-through;color:var(--ink3)}
.pri .acts{display:flex;gap:.1rem;opacity:.55}
.pri:hover .acts,.pri:focus-within .acts{opacity:1}
.pri.focus{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 12%,transparent),transparent);border-radius:8px}
.pri .handle{cursor:grab;color:var(--ink3);padding:.1rem .15rem;user-select:none}
.pri.over{box-shadow:0 -2px 0 var(--accent)}

/* week grid */
.wk{display:grid;grid-template-columns:50px repeat(7,minmax(90px,1fr));border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:auto;max-height:75vh}
.wk .wh{position:sticky;top:0;z-index:4;background:var(--card2);border-bottom:1px solid var(--line);padding:.4rem;text-align:center;font-family:var(--sans);font-size:.8rem;cursor:pointer}
.wk .wh.sel{color:var(--accent2);font-weight:600}
.wk .col{position:relative;border-left:1px solid var(--line)}
.wk .gut{position:relative}
.wk .gut span{position:absolute;right:6px;font-family:var(--sans);font-size:.68rem;color:var(--ink3);transform:translateY(-50%)}
.wk .hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);opacity:.6}
.wk .blk{left:3px;right:3px;font-size:.7rem;padding:.15rem .3rem}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.month .mh{font-family:var(--sans);font-size:.72rem;color:var(--ink3);text-align:center;padding:.2rem}
.month .mc{min-height:76px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:.25rem .35rem;cursor:pointer;font-family:var(--sans);font-size:.72rem}
.month .mc.out{opacity:.4}
.month .mc.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.month .mc.today .n{background:var(--accent);color:#1b120a;border-radius:99px;padding:0 .35rem}
.month .mc .ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:.25rem;align-items:center}

/* modal */
dialog{border:1px solid var(--line2);border-radius:16px;background:var(--card);color:var(--ink);padding:0;max-width:min(640px,94vw);width:100%;box-shadow:var(--shadow)}
dialog.wide{max-width:min(960px,96vw);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,7,4,.55);backdrop-filter:blur(2px)}
dialog .mh{padding:1rem 1.2rem .4rem;display:flex;justify-content:space-between;align-items:center}
dialog .mb{padding:.4rem 1.2rem 1rem;max-height:70vh;overflow:auto}
dialog .mf{padding:.8rem 1.2rem;border-top:1px solid var(--line);display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap}
.diff{font-family:var(--sans);font-size:.85rem}
.diff li{padding:.25rem 0}
.diff .from{color:var(--ink3);text-decoration:line-through}
.diff .to{color:var(--good);font-weight:600}

/* toast */
#toasts{position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);z-index:1000;display:flex;flex-direction:column;gap:.5rem;align-items:center;pointer-events:none}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:.55rem 1rem;border-radius:14px;max-width:92vw;font-family:var(--sans);font-size:.86rem;display:flex;gap:.8rem;align-items:center;box-shadow:var(--shadow);animation:tin .25s ease}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;font-family:var(--sans)}
[data-theme=dark] .toast button{color:#a8501c}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}

/* kanban */
.kan{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:.75rem;overflow-x:auto}
.kan .col{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:.6rem;min-height:120px}
.kan .col h4{margin:0 0 .5rem;font-family:var(--sans);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink3)}
.kan .kc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:.5rem .6rem;margin-bottom:.5rem;font-size:.9rem}

/* heatmap */
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px}
.heat i{width:12px;height:12px;border-radius:3px;background:var(--bg2);border:1px solid var(--line)}
.stars{color:#e8b84a;letter-spacing:1px}

.kbd{font-family:var(--sans);font-size:.7rem;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 .3rem;color:var(--ink2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hide{display:none!important}
@media print{nav.side,.mobile-nav,.hero .topright,.cmdbar{display:none}.shell{grid-template-columns:1fr}}
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
body{padding-left:var(--sal);padding-right:var(--sar);overscroll-behavior-y:none}
.hero .topright{top:calc(1rem + var(--sat))}
.tabbar{display:none}
.morelist button{display:flex;gap:.7rem;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:.85rem .3rem;font-size:1.05rem;color:var(--ink);text-align:left;cursor:pointer}
.connectbar{display:flex;gap:.6rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:1rem;padding:.6rem .9rem;border:1px dashed var(--line2);border-radius:var(--r);font-size:.9rem}
@media (max-width:860px){
  .mobile-nav{display:none!important}
  .hero{height:calc(150px + var(--sat))}
  .hero .topright{top:calc(.5rem + var(--sat));right:.6rem}
  .hero .topright .btn{padding:.35rem .6rem}
  #savePill span:last-child{max-width:9.5rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding:1rem .8rem calc(5.5rem + var(--sab))}

/* ---------- timeline pointer interactions ---------- */
function wireTimeline(sc) {
  const tl = $('.tl', sc); const r0 = +tl.dataset.r0, px = +tl.dataset.px;
  const yToMin = y => Math.round((y / px + r0) / 15) * 15;
  tl.addEventListener('dblclick', e => {
    if (e.target.closest('.blk')) return;
    const y = e.clientY - tl.getBoundingClientRect().top; const s = clamp(yToMin(y), 0, 1410);
    openBlockEditor(null, { date: R.date, start: s, end: s + 60 });
  });
  $$('.blk[data-blk]', tl).forEach(el => {
    const b = S.blocks.find(x => x.id === el.dataset.blk);
    el.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openBlockEditor(b.id); }
      if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown') && isMovable(b)) { e.preventDefault(); reviewMove(b.id, b.start + (e.key === 'ArrowUp' ? -15 : 15)); }
    });
    const startDrag = (grip, y0) => {
      const top0 = el.offsetTop, h0 = el.offsetHeight; let moved = false, tag = null, val = null;
      return {
        move(y) {
          const dy = y - y0; if (!moved && Math.abs(dy) < 5) return;
          if (!isMovable(b)) return;
          moved = true; el.classList.add('dragging');
          if (!tag) { tag = document.createElement('div'); tag.className = 'droptime'; tl.appendChild(tag); }
          if (grip) { val = Math.min(1440, Math.max(b.start + 15, yToMin(top0 + h0 + dy))); el.style.height = (val - b.start) * px - 2 + 'px'; tag.style.top = (val - r0) * px - 10 + 'px'; tag.textContent = 'ends ' + fmtTime(val); }
          else { val = clamp(yToMin(top0 + dy), 0, 1440 - (b.end - b.start)); el.style.top = (val - r0) * px + 'px'; tag.style.top = (val - r0) * px - 18 + 'px'; tag.textContent = fmtTime(val) + ' – ' + fmtTime(val + b.end - b.start); }
        },
        end(tapOpens = true) {
          tag && tag.remove(); el.classList.remove('dragging', 'lifted');
          if (!moved) { if (tapOpens) openBlockEditor(b.id); return; }
          if (grip) {
            if (val === b.end) return render();
            const hit = immovables(b.date, S.blocks, b.id).find(o => overlaps(o, { s: b.start, e: val }));
            commit('blocks', 'resize ' + b.title, bl => { bl.find(x => x.id === b.id).end = val; }, { toast: `${b.title} now ends ${fmtTime(val)}${hit ? ` — overlaps ${hit.title}` : ''}` });
          } else { if (val === b.start) return render(); render(); reviewMove(b.id, val); }
        },
      };
    };
    // mouse / pen: drag straight away
    el.addEventListener('pointerdown', e => {
      if (e.pointerType === 'touch' || e.button !== 0) return;
      R.interacting = true; const d = startDrag(!!e.target.dataset.grip, e.clientY); el.setPointerCapture(e.pointerId);
      const mv = ev => d.move(ev.clientY);
      const up = () => { el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', up); R.interacting = false; d.end(); flushPendingRender(); };
      el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
    });
    // touch: a quick tap opens the editor, press-and-hold lifts the block, the bottom handle resizes at once; a normal swipe scrolls the day
    el.addEventListener('touchstart', e => {
      if (e.touches.length !== 1) return;
      const t0 = e.touches[0], grip = !!e.target.dataset.grip && isMovable(b); R.interacting = true;
      let d = null, cancelled = false, x0 = t0.clientX, y0 = t0.clientY, timer = null;
      const lift = () => { d = startDrag(grip, y0); el.classList.add('lifted'); if (navigator.vibrate) navigator.vibrate(12); };
      if (grip) lift(); else if (isMovable(b)) timer = setTimeout(lift, 380);
      const mv = ev => { const t = ev.touches[0]; if (d) { ev.preventDefault(); d.move(t.clientY); } else if (Math.hypot(t.clientX - x0, t.clientY - y0) > 8) { cancelled = true; clearTimeout(timer); R.interacting = false; } };
      const end = ev => { clearTimeout(timer); R.interacting = false; el.removeEventListener('touchmove', mv); el.removeEventListener('touchend', end); el.removeEventListener('touchcancel', end); setTimeout(flushPendingRender, 0);
        if (d) { ev.preventDefault(); d.end(false); if (!el.classList.contains('dragging')) el.classList.remove('lifted'); }
        else if (!cancelled && ev.type === 'touchend') { ev.preventDefault(); openBlockEditor(b.id); } };
      el.addEventListener('touchmove', mv, { passive: false }); el.addEventListener('touchend', end); el.addEventListener('touchcancel', end);
    }, { passive: true });
  });
}
function reviewMove(id, ns) {
  const b = S.blocks.find(x => x.id === id); const r = ripple(b.date, id, ns);
  const list = r.ok ? r.changes.map(c => `<li><b>${esc(c.title)}</b>: <span class="from">${fmtTime(c.from)}</span> → <span class="to">${fmtTime(c.to)}</span>–${fmtTime(c.to + c.dur)}</li>`).join('') : '';
  openModal(`<div class="mh"><h3>Review move</h3><button class="iconbtn" data-act="close" aria-label="Close">✕</button></div>
   <div class="mb">${r.ok ? `<p class="small">${r.changes.length > 1 ? `Moving <b>${esc(b.title)}</b> pushes ${r.changes.length - 1} later flexible block${r.changes.length > 2 ? 's' : ''} by the minimum needed. Durations and dates stay the same; protected time doesn't move.` : 'Only this block changes.'}</p><ul class="diff">${list}</ul>`
      : `<p><b>This move can't be applied as-is.</b></p><p class="small">${esc(r.reason)}</p><p class="tiny muted sans">Choose a different time, or move it anyway and keep the overlap visible to decide later.</p>`}</div>
   <div class="mf"><button class="btn" data-act="close">Cancel</button>${r.ok ? '' : `<button class="btn" id="mvForce">Move anyway (keep overlap)</button>`}${r.ok ? `<button class="btn primary" id="mvApply">Apply ${r.changes.length > 1 ? r.changes.length + ' changes' : 'move'}</button>` : ''}</div>`, m => {
    if (r.ok) $('#mvApply', m).onclick = () => { closeModal(); applyChanges('move ' + b.title, r.changes); };
    else $('#mvForce', m).onclick = () => { closeModal(); applyChanges('move ' + b.title, [{ id, to: ns }]); };
  });
}

/* ---------- block editor ---------- */
function openBlockEditor(id, preset = {}) {
  const ex = id && S.blocks.find(b => b.id === id);
  const b = ex ? clone(ex) : { id: uid(), title: preset.title || '', date: preset.date || R.date, start: preset.start ?? 9 * 60, end: preset.end ?? 10 * 60, kind: preset.kind || 'flexible', cat: preset.cat || 'auto', notes: '', taskId: preset.taskId };
  const catOpts = `<option value="auto">Automatic (${CATS[autoCat(b.title)].label})</option>` + Object.entries(CATS).map(([k, c]) => `<option value="${k}" ${b.cat === k ? 'selected' : ''}>${c.label}</option>`).join('');
  openModal(`<div class="mh"><h3>${ex ? 'Edit block' : 'New block'}</h3><button class="iconbtn" data-act="close" aria-label="Close">✕</button></div>
  <form class="mb stack" id="bf">
    <label class="f">Activity<input name="title" value="${esc(b.title)}" required autofocus></label>
    <div class="fgrid"><label class="f">Date<input type="date" name="date" value="${b.date}"></label>
      <label class="f">Start<input type="time" name="start" step="300" value="${hhmm(b.start)}"></label>
      <label class="f">End <span class="tiny">(00:00 = midnight)</span><input type="time" name="end" step="300" value="${b.end === 1440 ? '00:00' : hhmm(b.end)}"></label></div>
    <div class="fgrid"><label class="f">Scheduling kind<select name="kind">${Object.entries(KINDS).map(([k, v]) => `<option value="${k}" ${b.kind === k ? 'selected' : ''}>${v}</option>`).join('')}</select></label>
      <label class="f">Activity colour<select name="cat">${catOpts}</select></label>
      <label class="f">Shortest acceptable (min)<input type="number" name="minLen" min="0" step="5" value="${b.minLen ?? ''}" placeholder="for Late start"></label></div>
    <label class="f">Notes<textarea name="notes" rows="2">${esc(b.notes || '')}</textarea></label>
    ${b.src === 'draft' || b.status ? `<div class="fgrid"><label class="f">Status<select name="status"><option value="">My own plan</option>${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${b.status === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></label>
      <div class="tiny muted sans" style="align-self:end">${b.src === 'draft' ? 'From the recovered working draft — not verified against the live site.' + (b.orig && b.orig !== b.title ? ` Original cell: “${esc(b.orig)}”.` : '') : ''}</div></div>` : ''}
    ${ex ? `<label class="row small sans"><input type="checkbox" name="done" ${b.done ? 'checked' : ''}> Done — this actually happened</label>` : ''}
    <div id="bfWarn" class="small sans" style="color:var(--warn)"></div>
    ${ex && b.kind === 'flexible' ? `<details class="disc"><summary>Split into two parts</summary><div class="in fgrid">
      <label class="f">First part ends<input type="time" name="splitAt" step="300" value="${hhmm(Math.round((b.start + b.end) / 2 / 15) * 15)}"></label>
      <label class="f">Rest goes on<input type="date" name="splitDate" value="${b.date}"></label>

      <div class="row" style="align-items:end"><button type="button" class="btn" id="bfSplit">Split</button></div></div></details>` : ''}
  </form>
  <div class="mf">${ex ? `<button class="btn danger" id="bfDel">Remove</button><button class="btn" id="bfDup">Duplicate</button>` : ''}<span class="grow"></span><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="bfSave">${ex ? 'Save' : 'Create block'}</button></div>`, m => {
    const f = $('#bf', m);
    const read = () => { const fd = Object.fromEntries(new FormData(f)); let e = fromHHMM(fd.end); if (e === 0) e = 1440; return { ...b, title: fd.title.trim(), date: fd.date, start: fromHHMM(fd.start), end: e, kind: fd.kind, cat: fd.cat, notes: fd.notes, minLen: fd.minLen === '' ? undefined : +fd.minLen, done: !!fd.done, status: fd.status !== undefined ? (fd.status || undefined) : b.status }; };

      w.textContent = hits.length ? 'Overlaps: ' + hits.map(x => `${x.title} (${fmtTimeShort(x.start)}–${fmtTimeShort(x.end)})`).join(', ') + ' — saved anyway if you continue.' : '';

/* ---------- quick add ---------- */
const cutAt = (s, l, frag) => { const i = l.indexOf(frag); return i < 0 ? s : (s.slice(0, i) + ' ' + s.slice(i + frag.length)).replace(/\b(on|for|this|next)\s*$/i, '').replace(/\s+(on|this|next)\s+(?=\S)/i, ' '); };

  if (wd) { const tgt = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'].indexOf(wd[1]); let x = base; for (let i = 0; i < 7; i++) { if (dow(x) === tgt) break; x = addDays(x, 1); } return [x, cutAt(s, l, wd[0])]; }

function capacityFor(ws) {
  const days = [...Array(7)].map((_, i) => addDays(ws, i)), c = S.capacity;
  const all = days.flatMap(x => S.blocks.filter(b => b.date === x)).filter(b => catOf(b) !== 'sleep' && !b.sleep);
  const bl = all.filter(b => b.status !== 'proposed'), draftH = sum(all.filter(b => b.status === 'proposed').map(b => b.end - b.start)) / 60;
  const hrs = f => sum(bl.filter(f).map(b => b.end - b.start)) / 60;
  const routineH = sum(S.routines.map(r => (r.mins || 0) * r.days.length)) / 60;
  const projH = sum(S.projects.map(p => +p.weekH || 0)), downH = sum(S.downsize.map(x => +x.weekH || 0));
  const wellH = sum(S.well.routines.filter(r => r.count).map(r => (+r.mins || 0) * (+r.perWeek || 0))) / 60;
  const targetsH = sum(c.targets.map(t => +t.hours || 0));
  const rows = [
    ['Sleep', (+c.sleepH || 0) * 7, 'sleep'], ['Meals & personal care', (+c.careH || 0) * 7, 'meals'], ['Transitions & buffers', (+c.bufferH || 0) * 7, 'travel'],
    ['Fixed appointments (dated)', hrs(b => b.kind === 'fixed'), 'appointments'], ['Protected time (dated)', hrs(b => b.kind === 'protected'), 'together'],
    ['Daily care routines', routineH, 'routine'], ['Project reservations', projH, 'focus'], ['Downsizing reservations', downH, 'other'], ['Well-being routines', wellH, 'exercise'], ['Flexible targets', targetsH, 'rest'],
  ];
  const used = sum(rows.map(r => r[1]));
  return { rows, used, free: 168 - used, flexSched: hrs(b => b.kind === 'flexible'), days, bl, draftH };
}

  return `<div class="sec-head"><div><h2>Projects</h2><p class="sans small">Deliverables, effort, this week's reserved hours, and reviewable next steps.</p></div><button class="btn primary" data-act="addProject">＋ Project</button></div>${tabsH}
   <div class="stack">${S.projects.map(p => { const steps = S.tasks.filter(t => t.projectId === p.id), dn = steps.filter(t => t.done).length, dl = p.deadline ? daysBetween(todayISO(), p.deadline) : null; return `<details class="disc" ${R.tab['p_' + p.id] !== 'closed' ? 'open' : ''}><summary><span>${esc(p.name)} <span class="chip">${esc(p.status)}</span> ${dl != null ? `<span class="chip ${dl < 0 ? 'bad' : dl < 14 ? 'warn' : ''}">${dl < 0 ? Math.abs(dl) + ' days past' : dl + ' days left'}</span>` : ''} ${steps.length ? `<span class="chip good">${dn}/${steps.length} steps</span>` : ''}</span></summary><div class="in stack">
     <div class="fgrid"><label class="f">Name<input data-b="projects.#${p.id}.name" data-rerender="1" value="${esc(p.name)}"></label><label class="f">Area<input data-b="projects.#${p.id}.area" value="${esc(p.area)}"></label>
       <label class="f">Status<select data-b="projects.#${p.id}.status" data-rerender="1">${PSTATUS.map(s => `<option ${p.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></label><label class="f">Deadline<input type="date" data-b="projects.#${p.id}.deadline" data-rerender="1" value="${p.deadline || ''}"></label>
       <label class="f">Total effort h<input type="number" data-b="projects.#${p.id}.effortH" value="${p.effortH}"></label><label class="f">Reserve this week h<input type="number" data-b="projects.#${p.id}.weekH" value="${p.weekH}"></label></div>

     <label class="f">Notes / brain-dump<textarea data-b="projects.#${p.id}.notes" rows="3" placeholder="Paste a plan, one idea per line, then turn it into steps">${esc(p.notes)}</textarea></label>
     <div class="row"><button class="btn sm" data-act="reviewSteps" data-id="${p.id}">Review notes into steps…</button><span class="grow"></span><button class="btn sm danger" data-act="delProject" data-id="${p.id}">Remove project</button></div>
     ${steps.length ? `<div>${steps.map(t => `<div class="row small" style="padding:.2rem 0"><button class="iconbtn" data-act="taskDone" data-id="${t.id}">${t.done ? '✅' : '◻️'}</button><span class="grow" style="${t.done ? 'text-decoration:line-through;opacity:.6' : ''}">${esc(t.title)}</span>${t.mins ? `<span class="tiny muted">${fmtDur(t.mins)}</span>` : ''}<button class="iconbtn" data-act="taskEdit" data-id="${t.id}">✎</button></div>`).join('')}</div>` : ''}
   </div></details>`; }).join('') || '<div class="empty">No projects yet.</div>'}</div>`;
};
Object.assign(ACT, {
  addProject: () => commit('projects', 'add project', ps => ps.unshift({ id: uid(), name: 'New project', area: '', deadline: '', status: 'Idea', next: '', effortH: '', weekH: '', deliverables: '', notes: '', steps: [] })),
  delProject: async el => { if (await confirmBox('Remove this project? Its next steps stay in your list.')) commit('projects', 'remove project', ps => ps.splice(ps.findIndex(p => p.id === el.dataset.id), 1), { toast: 'Project removed' }); },
  addContent: () => commit('content', 'add idea', cs => cs.push({ id: uid(), title: '', format: 'Post', status: 'Draft', date: '', caption: '' })),
  cMove: el => commit('content', 'move card', cs => { const c = cs.find(x => x.id === el.dataset.id); const L = ['Draft', 'Review', 'Approved', 'Posted']; c.status = L[clamp(L.indexOf(c.status) + +el.dataset.n, 0, 3)]; }),
  cCopy: el => { const c = S.content.find(x => x.id === el.dataset.id); navigator.clipboard?.writeText(c.caption || '').then(() => toast('Caption copied — check placeholders before posting'), () => toast('Copy not allowed here')); },
  reviewSteps: el => {
    const p = S.projects.find(x => x.id === el.dataset.id);
    const ta = $(`[data-b="projects.#${p.id}.notes"]`); if (ta && ta.value !== p.notes) { p.notes = ta.value; markDirty('projects'); }
    if (!p.notes.trim()) return toast('Write or paste some notes first');
    const lines = p.notes.split(/\n|(?<=\.)\s+(?=[A-Z])/).map(s => s.replace(/^\s*([-*•]|\d+[.)])\s*/, '').trim()).filter(s => s.length > 2);
    openModal(`<div class="mh"><h3>Turn notes into steps</h3><button class="iconbtn" data-act="close" aria-label="Close">✕</button></div><div class="mb"><p class="small muted">Edit, untick, or add. Only ticked steps join your next steps — they don't inherit the deadline or reserve time.</p>
      <div id="rsl">${lines.map((l, i) => `<div class="row" style="margin:.3rem 0"><input type="checkbox" checked data-i="${i}"><input class="grow" value="${esc(l)}" data-l="${i}"><input type="number" placeholder="min" style="width:4.5rem" data-m="${i}"></div>`).join('')}</div>
      <button class="btn sm" id="rsAdd">＋ Another step</button></div><div class="mf"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="rsOk">Accept reviewed steps</button></div>`, m => {
      let n = lines.length; $('#rsAdd', m).onclick = () => { $('#rsl', m).insertAdjacentHTML('beforeend', `<div class="row" style="margin:.3rem 0"><input type="checkbox" checked data-i="${n}"><input class="grow" data-l="${n}"><input type="number" placeholder="min" style="width:4.5rem" data-m="${n}"></div>`); n++; };
      $('#rsOk', m).onclick = () => {
        const add = $$('[data-i]', m).filter(c => c.checked).map(c => ({ title: $(`[data-l="${c.dataset.i}"]`, m).value.trim(), mins: $(`[data-m="${c.dataset.i}"]`, m).value })).filter(x => x.title);
        closeModal(); commit('tasks', 'accept steps', ts => add.forEach((a, i) => ts.push({ id: uid(), title: a.title, mins: a.mins === '' ? '' : +a.mins, area: AREAS.includes(p.area) ? p.area : 'Life admin', status: 'Confirmed', date: null, projectId: p.id, notes: '', order: 1000 + i })), { toast: `${add.length} step${add.length === 1 ? '' : 's'} added` });
      };
    });
  },
});

/* ================= Move & downsizing ================= */
const DECISIONS = ['Undecided', 'Keep', 'Sell', 'Donate', 'Discard'], DSTATUS = ['Not started', 'Sorting', 'Ready to leave', 'Gone', 'Packed'];
VIEWS.move = () => {
  const [tab, tabsH] = tabs('move', [['plan', 'Transition plan'], ['down', 'Downsizing'], ['pack', 'Packing order'], ['roles', 'Income directions']]);
  const mv = S.move; let body = '';
  if (tab === 'plan') body = `<div class="card" style="margin-bottom:1rem"><label class="f">Move timing<input data-b="move.when" value="${esc(mv.when)}"></label></div><div class="grid3">${mv.phases.map((ph, pi) => `<div class="card stack"><div class="tiny muted sans">PHASE ${pi + 1}</div><h3>${esc(ph.name)}</h3>
     ${ph.items.map(it => { const t = it.taskId && S.tasks.find(x => x.id === it.taskId); return `<div class="row small"><input type="checkbox" data-b="move.phases#${ph.id}.items#${it.id}.done" data-rerender="1" ${it.done || (t && t.done) ? 'checked' : ''} aria-label="Done"><input class="grow" data-b="move.phases#${ph.id}.items#${it.id}.title" value="${esc(it.title)}">${t ? '<span class="chip good" title="In your next steps">in plan</span>' : `<button class="iconbtn" title="Add to my plan" data-act="msTask" data-ph="${ph.id}" data-id="${it.id}">→</button>`}<button class="iconbtn" data-act="delRow" data-path="move.phases#${ph.id}.items" data-id="${it.id}" aria-label="Remove">✕</button></div>`; }).join('') || '<div class="tiny muted sans">No milestones yet.</div>'}
     <button class="btn sm ghost" data-act="addRow" data-path="move.phases#${ph.id}.items" data-new='{"title":"","done":false}'>＋ Milestone</button></div>`).join('')}</div>
     <p class="tiny muted sans">The archive kept the three phases but not the twelve milestone titles — add yours here. Adding one to your plan creates a next step; it doesn't sign, book or contact anything.</p>`;
  if (tab === 'down') {
    const exp = sum(S.downsize.map(x => +x.expected || 0)), rec = sum(S.downsize.map(x => +x.received || 0)), gone = S.downsize.filter(x => x.status === 'Gone' || x.status === 'Packed').length;
    body = `<div class="grid3" style="margin-bottom:1rem"><div class="stat"><div class="k">Batches</div><div class="v">${S.downsize.length}</div><div class="s">${gone} gone or packed</div></div><div class="stat"><div class="k">Expected proceeds</div><div class="v">${money(exp, '$0')}</div></div><div class="stat"><div class="k">Actually received</div><div class="v" style="color:var(--good)">${money(rec, '$0')}</div></div></div>
    <div class="card">${tableEditor({ path: 'downsize', cols: [{ f: 'space', label: 'Space', w: '8rem' }, { f: 'desc', label: 'What' }, { f: 'decision', label: 'Decision', type: 'select', opts: DECISIONS, w: '7.5rem' }, { f: 'status', label: 'Status', type: 'select', opts: DSTATUS, w: '8.5rem', rerender: 1 }, { f: 'expected', label: 'Expected $', type: 'number', w: '6rem', rerender: 1 }, { f: 'received', label: 'Received $', type: 'number', w: '6rem', rerender: 1 }, { f: 'weekH', label: 'h this wk', type: 'number', w: '5rem' }, { f: 'target', label: 'By', type: 'date', w: '9rem' }, { f: 'next', label: 'Next action' }], addLabel: 'Batch', newItem: { space: '', desc: '', decision: 'Undecided', status: 'Not started', expected: '', received: '', weekH: '', target: '', next: '' }, empty: 'Start with one small space — a drawer, a shelf, one box.' })}
    <p class="tiny muted sans">Choosing “Sell” or “Gone” doesn't sell anything. When a Sell batch is marked Gone with a received amount, you'll be offered a Money entry to confirm.</p></div>
    <details class="disc" style="margin-top:1rem"><summary>A gentle sorting guide</summary><div class="in small"><p>Pick one small space and a short session (20–30 minutes). Give everything a destination before you start: keep, sell, donate, discard, or “decide later” — a box with a date on it.</p><p>Hard decisions: photograph sentimental items, keep the best one of a set, and park anything you're stuck on in “Undecided” instead of forcing it.</p><p>Safe stopping points: bag and label what's sorted, put the Undecided box back, and write the next action in the batch before you stop. Check local acceptance rules before a donation or recycling run.</p></div></details>`;
  }
  if (tab === 'pack') body = `<div class="card stack">${mv.packing.map((p, i) => `<div class="row"><span class="chip">${i + 1}</span><input type="checkbox" data-b="move.packing#${p.id}.done" ${p.done ? 'checked' : ''} aria-label="Done"><b class="grow">${esc(p.title)}</b><input data-b="move.packing#${p.id}.notes" value="${esc(p.notes)}" placeholder="notes" style="flex:1"></div>`).join('')}<p class="tiny muted sans">Relative phases, not deadlines — the move month isn't settled. Protect the next workday: pack the work kit last and unpack it first.</p></div>`;
  if (tab === 'roles') body = `<div class="stack">${mv.roles.map((r, i) => `<div class="card row" style="align-items:flex-start"><div class="stack" style="gap:.2rem"><button class="iconbtn" data-act="roleMv" data-i="${i}" data-n="-1" aria-label="Move up" ${i ? '' : 'disabled'}>▲</button><button class="iconbtn" data-act="roleMv" data-i="${i}" data-n="1" aria-label="Move down" ${i < mv.roles.length - 1 ? '' : 'disabled'}>▼</button></div>
     <div class="grow stack"><div class="row"><input data-b="move.roles#${r.id}.title" value="${esc(r.title)}" class="grow" style="font-weight:600"><select data-b="move.roles#${r.id}.status">${['Proposal', 'Discussing', 'Agreed', 'Paused', 'Dropped'].map(s => `<option ${r.status === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div><textarea data-b="move.roles#${r.id}.notes" rows="2">${esc(r.notes)}</textarea></div></div>`).join('')}
     <button class="btn sm" data-act="addRow" data-path="move.roles" data-new='{"title":"New direction","notes":"","status":"Proposal"}'>＋ Direction</button><p class="tiny muted sans">Order is your own priority. “Agreed” is a label you set — the planner doesn't treat anything as a signed agreement.</p></div>`;
  return `<div class="sec-head"><div><h2>Move & downsizing</h2><p class="sans small">Moving with continuity of work: milestones, possessions, packing order and income directions.</p></div></div>${tabsH}${body}`;
};
Object.assign(ACT, {
  msTask: el => { const ph = S.move.phases.find(p => p.id === el.dataset.ph), it = ph.items.find(i => i.id === el.dataset.id); if (!it.title) return toast('Give the milestone a title first'); const t = { id: uid(), title: it.title, area: 'Move', status: 'Confirmed', date: null, notes: 'From move plan: ' + ph.name, mins: '', order: 500 }; commit('tasks', 'add milestone', ts => ts.push(t)); commit('move', 'link', m => { m.phases.find(p => p.id === ph.id).items.find(i => i.id === it.id).taskId = t.id; }, { toast: 'Added to your next steps' }); },
  roleMv: el => commit('move', 'reorder', m => { const i = +el.dataset.i, j = i + +el.dataset.n; [m.roles[i], m.roles[j]] = [m.roles[j], m.roles[i]]; }),

/* follow-through: a Sell batch marked Gone with money received → offer a Money entry */
document.addEventListener('change', e => {
  const b = e.target.dataset && e.target.dataset.b; if (!b || !/^downsize\.#/.test(b) || !/\.(status|received)$/.test(b)) return;
  setTimeout(() => {
    const id = b.split('#')[1].split('.')[0], x = S.downsize.find(y => y.id === id);
    if (x && x.decision === 'Sell' && x.status === 'Gone' && +x.received > 0 && !x.offered) {
      S.downsize.find(y => y.id === id).offered = true; markDirty('downsize');
      toast(`Record ${money(x.received)} from “${x.desc || x.space}” as received income?`, 'Add to Money', () => commit('money', 'downsizing income', M => M.entries.push({ id: uid(), type: 'income', desc: 'Sold: ' + (x.desc || x.space), cat: 'Downsizing', date: todayISO(), est: +x.received, actual: +x.received, settled: false })), 9000);
    }
  }, 30);
});

/* ================= Opportunities ================= */

    <div class="row">${age == null ? '<span class="chip warn">never checked</span>' : `<span class="chip ${age > 14 ? 'warn' : 'good'}">checked ${age === 0 ? 'today' : age + 'd ago'}</span>`}${dl != null ? `<span class="chip ${dl < 0 ? 'bad' : dl <= 7 ? 'warn' : ''}">${dl < 0 ? 'closed ' + fmtShort(o.deadline) : 'due ' + fmtShort(o.deadline)}</span>` : '<span class="chip">no verified deadline</span>'}${o.url ? `<a class="chip" href="${esc(o.url)}" target="_blank" rel="noopener">source ↗</a>` : ''}</div>

      <label class="f">Pay / cost<input data-b="opps.#${o.id}.pay" value="${esc(o.pay)}"></label><label class="f">Hours / schedule<input data-b="opps.#${o.id}.hours" value="${esc(o.hours)}"></label><label class="f">Location<input data-b="opps.#${o.id}.location" value="${esc(o.location)}"></label>
      <label class="f">Deadline<input type="date" data-b="opps.#${o.id}.deadline" data-rerender="1" value="${o.deadline || ''}"></label><label class="f">Last checked<input type="date" data-b="opps.#${o.id}.checked" data-rerender="1" value="${o.checked || ''}"></label><label class="f">Source link<input type="url" data-b="opps.#${o.id}.url" data-rerender="1" value="${esc(o.url)}"></label></div>

Object.assign(ACT, {

/* ================= Well-being ================= */
const TRACK = { nutrition: ['Nutrition', '🥕'], movement: ['Movement', '🌿'], clarity: ['Mental clarity & inspiration', '✨'] };
const IDEAS = {
  nutrition: ['Add one extra vegetable to lunch', 'Cook a pot of beans or lentils for the week', 'Ginger or peppermint tea after dinner', 'Prep a snack box before a long shift', 'Drink a glass of water before coffee'],
  movement: ['10-minute walk with the dog', 'Gentle hip-opening stretch', 'Practice one dance combination', 'Take the stairs', 'Five minutes of yoga before bed'],
  clarity: ['Write three lines in a journal', 'Phone-free first 20 minutes', 'Step outside and notice five things', 'Tidy one surface', 'Read a few pages of something you love'],

VIEWS.well = () => {
  const [tr, trH] = tabs('well', Object.entries(TRACK).map(([k, v]) => [k, v[1] + ' ' + v[0]]));
  const W = S.well, logs = W.logs.filter(l => l.tracker === tr && !l.undone).sort((a, b) => b.date.localeCompare(a.date) || (b.at || 0) - (a.at || 0));
  const start = addDays(weekStart(todayISO()), -7 * 15), cells = [...Array(16 * 7)].map((_, i) => addDays(start, i));
  const per = {}; for (const l of logs) per[l.date] = (per[l.date] || 0) + 1;
  let streak = 0; for (let x = todayISO(); per[x]; x = addDays(x, -1)) streak++;
  const ideas = IDEAS[tr], idea = ideas[(+todayISO().slice(8) + (R.tab.ideaN || 0)) % ideas.length];
  const goals = W.goals.filter(g => g.tracker === tr && !g.archived);
  return `<div class="sec-head"><div><h2>Well-being</h2><p class="sans small">Optional, personal, and never a score. A star means something was logged — nothing more.</p></div></div>${trH}
  <div class="grid2">
    <div class="card stack"><h3>Log an activity</h3>
      <form id="wlf" class="stack"><input name="what" placeholder="What did you do?" required>
      <div class="fgrid"><label class="f">Date<input type="date" name="date" value="${R.date > todayISO() ? todayISO() : R.date}"></label><label class="f">Who<select name="who">${whoOpts().map(p => `<option>${esc(p)}</option>`).join('')}</select></label><label class="f">Minutes<input type="number" name="mins" min="0" placeholder="optional"></label></div>
      <input name="note" placeholder="Note (optional)"><button class="btn primary" style="align-self:start">Log activity</button></form>

function toICS(from, to) {
  const pad = n => String(n).padStart(2, '0'), stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const dt = (d, m) => d.replace(/-/g, '') + 'T' + pad(Math.floor(m / 60)) + pad(m % 60) + '00';
  const escI = s => String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, x => '\\' + x);
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Life Garden//EN', 'CALSCALE:GREGORIAN',
    'BEGIN:VTIMEZONE', 'TZID:America/Los_Angeles', 'BEGIN:DAYLIGHT', 'TZOFFSETFROM:-0800', 'TZOFFSETTO:-0700', 'TZNAME:PDT', 'DTSTART:19700308T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU', 'END:DAYLIGHT', 'BEGIN:STANDARD', 'TZOFFSETFROM:-0700', 'TZOFFSETTO:-0800', 'TZNAME:PST', 'DTSTART:19701101T020000', 'RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU', 'END:STANDARD', 'END:VTIMEZONE'];
  const ny = d => /New Jersey/i.test((S.daynotes[d] || {}).basis || '');
  const blocks = S.blocks.filter(b => b.date >= from && b.date <= to && !b.icsUid && !b.sleep && (b.status !== 'proposed' || S.settings.icsDraft));
  if (blocks.some(b => ny(b.date))) L.push('BEGIN:VTIMEZONE', 'TZID:America/New_York', 'BEGIN:DAYLIGHT', 'TZOFFSETFROM:-0500', 'TZOFFSETTO:-0400', 'TZNAME:EDT', 'DTSTART:19700308T020000', 'RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU', 'END:DAYLIGHT', 'BEGIN:STANDARD', 'TZOFFSETFROM:-0400', 'TZOFFSETTO:-0500', 'TZNAME:EST', 'DTSTART:19701101T020000', 'RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU', 'END:STANDARD', 'END:VTIMEZONE');
  for (const b of blocks) {
    const tz = ny(b.date) ? 'America/New_York' : 'America/Los_Angeles';
    const endD = b.end === 1440 ? addDays(b.date, 1) : b.date, endM = b.end === 1440 ? 0 : b.end;
    L.push('BEGIN:VEVENT', `UID:${b.id}@lifegarden`, `DTSTAMP:${stamp}`, `DTSTART;TZID=${tz}:${dt(b.date, b.start)}`, `DTEND;TZID=${tz}:${dt(endD, endM)}`, `SUMMARY:${escI(b.title)}`, `CATEGORIES:${escI(CATS[catOf(b)].label)}`, ...(b.status ? [`X-LIFEGARDEN-STATUS:${escI(STATUS[b.status][0])}`] : []), `TRANSP:${b.kind === 'flexible' ? 'TRANSPARENT' : 'OPAQUE'}`);
    if (b.notes) L.push(`DESCRIPTION:${escI(b.notes)}`);
    if (S.settings.icsAlarm) L.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${escI(b.title)}`, `TRIGGER:-PT${+S.settings.icsAlarm}M`, 'END:VALARM');
    L.push('END:VEVENT');
  }

}
function fromICS(text) {
  const lines = text.replace(/\r?\n[ \t]/g, '').split(/\r?\n/); const evs = []; let cur = null;
  for (const ln of lines) {
    if (ln === 'BEGIN:VEVENT') cur = {}; else if (ln === 'END:VEVENT') { cur && evs.push(cur); cur = null; }
    else if (cur) { const i = ln.indexOf(':'); if (i < 0) continue; const [k, ...params] = ln.slice(0, i).split(';'); cur[k] = { v: ln.slice(i + 1), p: params.join(';') }; }
  }
  const conv = f => {
    if (!f) return null; const v = f.v;
    if (/VALUE=DATE/.test(f.p) || /^\d{8}$/.test(v)) return { allDay: true, date: `${v.slice(0, 4)}-${v.slice(4, 6)}-${v.slice(6, 8)}` };
    const m = v.match(/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)/); if (!m) return null;
    if (v.endsWith('Z')) { const p = pacificParts(new Date(Date.UTC(+m[1], m[2] - 1, +m[3], +m[4], +m[5]))); return p; }
    return { date: `${m[1]}-${m[2]}-${m[3]}`, min: +m[4] * 60 + +m[5] }; // TZID or floating: treated as Pacific
  };
  const out = []; let skipped = 0;
  for (const e of evs) {
    const s = conv(e.DTSTART), en = conv(e.DTEND); if (!s || s.allDay) { skipped++; continue; }
    let end = en && !en.allDay ? (en.date === s.date ? en.min : 1440) : s.min + 60; if (end <= s.min) end = Math.min(1440, s.min + 30);

    out.push({ id: uid(), icsUid: e.UID ? e.UID.v : uid(), title, date: s.date, start: s.min, end, kind: 'fixed', cat: 'auto', notes: 'Imported from calendar file' });
  }
  return { out, skipped };
}

  connectCode: () => { const c = readSetupCode($('#setupCode').value); if (!c) return toast('That doesn’t look like a setup link or code'); doConnect(c); },
  copySetupLink: () => navigator.clipboard?.writeText(setupLink(sync.cfg)).then(() => toast('Setup link copied — text it to Jordan'), () => openModal(`<div class="mh"><h3>Setup link</h3></div><div class="mb"><textarea rows="4" readonly>${esc(setupLink(sync.cfg))}</textarea></div><div class="mf"><button class="btn" data-act="close">Done</button></div>`)),
  copyScript: () => scriptText ? navigator.clipboard?.writeText(scriptText).then(() => toast('Script copied — paste it into Apps Script'), () => toast('Copy blocked — use “View it” and copy from there')) : toast('Script still loading — try again in a second'),
  disconnect: async () => { if (await confirmBox('Stop syncing this device? The plan stays on this phone; the Sheet keeps its copy.', 'Disconnect')) { disconnectSheet(); render(); } },
});
const backupText = () => JSON.stringify({ app: 'life-garden', version: 1, exported: new Date().toISOString(), data: S }, null, 1);
function restore(txt) {
  let o; try { o = JSON.parse(txt); } catch (e) { return toast('That isn’t valid backup text'); }
  const d = o.data || o; if (!d.blocks || !d.settings) return toast('That doesn’t look like a Life Garden backup');
  undoStack.push(...SECTIONS.map(k => ({ k, prev: JSON.stringify(S[k]), label: 'restore' })));
  const base = defaults(); for (const k of SECTIONS) { S[k] = d[k] !== undefined ? d[k] : base[k]; markDirty(k); }
  render(); toast('Backup restored', 'Undo', () => { for (let i = 0; i < SECTIONS.length; i++) undo(); });
}
Object.assign(ACT, {
  exportJson: () => downloadFile(`life-garden-backup-${todayISO()}.json`, backupText(), 'application/json'),
  copyJson: () => navigator.clipboard?.writeText(backupText()).then(() => toast('Backup copied — paste it somewhere safe'), () => toast('Clipboard not allowed here')),
  importJson: async () => { const f = $('#impFile').files[0]; const txt = f ? await f.text() : $('#impText').value; if (!txt.trim()) return toast('Choose a file or paste backup text'); if (await confirmBox('Replace the whole current plan with this backup?', 'Restore')) restore(txt); },
  exportIcs: () => { const a = $('#icsFrom').value, b = $('#icsTo').value; const n = S.blocks.filter(x => x.date >= a && x.date <= b && !x.icsUid && !x.sleep && (x.status !== 'proposed' || S.settings.icsDraft)).length; if (!n) return toast('No planner blocks in that range'); downloadFile(`life-garden-${a}-to-${b}.ics`, toICS(a, b), 'text/calendar'); toast(`${n} block${n === 1 ? '' : 's'} exported`); },
  resetAll: async () => { if (!(await confirmBox('Reset everything? A backup is the only way back after you leave this page.', 'Reset'))) return; const base = defaults(); for (const k of SECTIONS) { undoStack.push({ k, prev: JSON.stringify(S[k]), label: 'reset' }); S[k] = base[k]; markDirty(k); } render(); toast('Plan reset'); },
});

/* ================= recovered working-draft import ================= */
const qArea = t => /academ|lesley|reading|school/i.test(t) ? 'Academic' : /reloc|move|travel/i.test(t) ? 'Move' : /glimmer|festival|post-move|showcase|film/i.test(t) ? 'Dance & Glimmer' : /sleep|wednesday|thursday|cafe|cycle|roster/i.test(t) ? 'Well-being' : 'Life admin';
function applyRecovery(pack, opts, extraSettings) {
  const have = new Set(S.blocks.map(b => b.id));
  const add = opts.blocks.filter(b => !have.has(b.id)).map(b => ({ ...b, cat: b.sleep ? 'sleep' : 'auto' }));
  let steps = 1;
  commit('blocks', 'import recovered draft', bl => bl.push(...add), { render: false });
  if (opts.notes) { steps++; commit('daynotes', 'import day notes', dn => { for (const [k, v] of Object.entries(pack.dayNotes || {})) dn[k] = { ...v, src: 'draft' }; }, { render: false }); }
  let nq = 0;
  if (opts.qs) { steps++; commit('tasks', 'import open questions', ts => {
    const ids = new Set(ts.map(t => t.id));
    for (const q of (pack.questions || []).filter(q => q.item && q.item !== 'Item')) {
      const id = 'rq-' + q.item.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      if (ids.has(id)) continue; nq++;
      ts.push({ id, title: 'Confirm: ' + q.item, area: qArea(q.item + ' ' + q.handling), status: 'Needs verification', date: null, mins: '', notes: `${q.detail}\n${q.handling}\nSource: ${q.source} (recovered working draft)`, order: 900 + nq, src: 'draft' });
    }
  }, { render: false }); }
  if (opts.sleepWin || extraSettings) { steps++; commit('settings', 'sleep window', st => { if (opts.sleepWin) { st.sleepFrom = '22:30'; st.sleepTo = '07:00'; } Object.assign(st, extraSettings || {}); }, { render: false }); }
  render();
  toast(`Added ${add.length} recovered blocks${nq ? ` and ${nq} open questions` : ''}`, 'Undo', () => { for (let i = 0; i < steps; i++) undo(); }, 9000);
  return add.length;
}
function openRecoveryImport(pack) {
  const all = pack.blocks || [], have = new Set(S.blocks.map(b => b.id));
  const dates = all.map(b => b.date).sort(), d0 = dates[0], d1 = dates[dates.length - 1];
  const cnt = st => all.filter(b => b.status === st && !b.sleep).length;
  openModal(`<div class="mh"><h3>Bring in the recovered working draft</h3><button class="iconbtn" data-act="close" aria-label="Close">✕</button></div>
  <div class="mb stack small">
    <p style="margin:0">${esc(pack.source?.name || 'Recovered draft')} · ${fmtShort(d0)} – ${fmtShort(d1)}, ${all.length} blocks rebuilt from hourly rows. Nothing here was verified against the old live site — every block keeps its draft status, and proposals look dashed so they can't be mistaken for bookings.</p>
    <fieldset class="card flat" style="padding:.6rem .8rem"><legend class="tiny sans muted">Which blocks</legend>
      ${Object.entries(STATUS).map(([k, v]) => `<label class="row sans"><input type="checkbox" name="st" value="${k}" checked> ${v[1]} ${v[0]} <span class="muted">(${cnt(k)})</span></label>`).join('')}
      <label class="row sans"><input type="checkbox" id="riSleep"> Also add sleep-target blocks <span class="muted">(${all.filter(b => b.sleep).length} — usually better as the shaded sleep window)</span></label>
      <div class="fgrid" style="margin-top:.4rem"><label class="f">From<input type="date" id="riFrom" value="${d0}"></label><label class="f">To<input type="date" id="riTo" value="${d1}"></label></div></fieldset>
    <label class="row sans"><input type="checkbox" id="riNotes" checked> Day notes, phases and the week's suggested priority (${Object.keys(pack.dayNotes || {}).length} days)</label>
    <label class="row sans"><input type="checkbox" id="riQs" checked> Open questions as next steps marked “Needs verification” (${(pack.questions || []).filter(q => q.item !== 'Item').length})</label>
    <label class="row sans"><input type="checkbox" id="riSleepWin" checked> Use the draft's sleep target (22:30–07:00) as the shaded sleep window</label>
    <p class="tiny muted sans" id="riSum"></p>
  </div><div class="mf"><button class="btn" data-act="close">Cancel</button><button class="btn primary" id="riGo">Add to my plan</button></div>`, m => {
    const pick = () => {
      const sts = new Set($$('[name=st]:checked', m).map(x => x.value)), sl = $('#riSleep', m).checked, f = $('#riFrom', m).value, t = $('#riTo', m).value;
      return all.filter(b => (b.sleep ? sl : sts.has(b.status)) && b.date >= f && b.date <= t);
    };
    const upd = () => { const p = pick(), dup = p.filter(b => have.has(b.id)).length; $('#riSum', m).textContent = `${p.length - dup} blocks will be added${dup ? `, ${dup} already in your plan are skipped` : ''}. You can undo this, or later remove every untouched recovered block from Settings & backup.`; };
    m.addEventListener('change', upd); upd();
    $('#riGo', m).onclick = () => {
      const opts = { blocks: pick(), notes: $('#riNotes', m).checked, qs: $('#riQs', m).checked, sleepWin: $('#riSleepWin', m).checked };
      closeModal(); applyRecovery(pack, opts);
    };
  });
}
Object.assign(ACT, {
  removeDraft: async () => {
    const n = S.blocks.filter(b => b.src === 'draft' && !b.edited && !b.done).length;
    if (!n) return toast('No untouched recovered blocks to remove');
    if (await confirmBox(`Remove ${n} recovered draft blocks you haven't edited or marked done? Blocks you changed stay.`, 'Remove')) commit('blocks', 'remove recovered draft', bl => { for (let i = bl.length - 1; i >= 0; i--) if (bl[i].src === 'draft' && !bl[i].edited && !bl[i].done) bl.splice(i, 1); }, { toast: `Removed ${n} recovered blocks` });
  },
});

/* ================= boot ================= */
loadLocal();
if (!S.capacity.whatIf) S.capacity.whatIf = {};
parseHash();

render();
(function handleConnectLink() {
  const m = location.hash.match(/^#connect=(.+)$/); if (!m) return;
  const cfg = readSetupCode(m[1]); history.replaceState(null, '', '#today'); R.view = 'today';
  if (!cfg) return toast('That setup link is incomplete');
  const standalone = window.navigator.standalone || matchMedia('(display-mode: standalone)').matches;
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  if (ios && !standalone) {
    openModal(`<div class="mh"><h3>Put Life Garden on your Home Screen</h3></div><div class="mb small stack">
      <p><b>1.</b> Tap <b>Copy setup code</b> below.</p><p><b>2.</b> Tap the Share button <span class="kbd">⬆</span> at the bottom of Safari, then <b>Add to Home Screen</b> → <b>Add</b>.</p>
      <p><b>3.</b> Open <b>Life Garden</b> from your Home Screen, go to <b>Settings & backup</b>, paste the code in “Connect a Google Sheet”, and tap Connect.</p>
      <p class="tiny muted sans">The Home Screen app keeps its own storage, which is why the code is pasted there rather than here.</p></div>
      <div class="mf"><button class="btn" data-act="close">Later</button><button class="btn primary" id="cpy">Copy setup code</button></div>`, mm => { $('#cpy', mm).onclick = () => navigator.clipboard?.writeText(setupCode(cfg)).then(() => { toast('Code copied'); }, () => { $('#cpy', mm).replaceWith(Object.assign(document.createElement('textarea'), { value: setupCode(cfg), readOnly: true, rows: 3 })); }); });
    return;
  }
  confirmBox('Connect this device to the shared Life Garden Google Sheet?', 'Connect').then(ok => ok && doConnect(cfg));
})();
if (sync.cfg) syncNow({ quiet: true }); else setStatus('local', 'Saved on this device');
setInterval(() => { if (R.view === 'today' && R.date === todayISO() && !dlg().open && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) { const n = $('.tl .now'); const tl = $('.tl'); if (n && tl) n.style.top = (nowMin() - +tl.dataset.r0) * +tl.dataset.px + 'px'; } }, 60000);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
</script>
</body></html>
